<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Handsome & Pretty Offers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F5F6F8; --paper:#FFFFFF; --soft:#EFF1F4; --ink:#18222E; --muted:#5B6674; --line:#DADFE6;
  --rose:#A63D63; --rose-soft:#F8E6ED; --sage:#2F7565; --sage-soft:#E0F0EB; --amber:#A8660C; --amber-soft:#FCEFD8; --red:#B83A2E; --red-soft:#FBE3E0;
  --head:#1D2B3A; --head2:#263849; --head-ink:#EEF2F6; --shadow:0 12px 32px rgba(20,30,45,.18); --hh:120px;
  --f:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif; --d:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif; --m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#10161D; --paper:#18212B; --soft:#1F2A36; --ink:#E6EBF0; --muted:#9AA6B3; --line:#2C3947;
  --rose:#E07BA0; --rose-soft:#3A2230; --sage:#5DC0A6; --sage-soft:#17332C; --amber:#E9AE52; --amber-soft:#3A2C15; --red:#EE7F73; --red-soft:#3C201D; --head:#0B1117; --head2:#141E28; --head-ink:#E6EBF0; --shadow:0 12px 32px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#10161D; --paper:#18212B; --soft:#1F2A36; --ink:#E6EBF0; --muted:#9AA6B3; --line:#2C3947;
  --rose:#E07BA0; --rose-soft:#3A2230; --sage:#5DC0A6; --sage-soft:#17332C; --amber:#E9AE52; --amber-soft:#3A2C15; --red:#EE7F73; --red-soft:#3C201D; --head:#0B1117; --head2:#141E28; --head-ink:#E6EBF0; --shadow:0 12px 32px rgba(0,0,0,.5)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--f)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate}
h1,h2,h3{font-family:var(--d);text-wrap:balance;line-height:1.35}

.top{background:var(--head);color:var(--head-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.bar{max-width:1100px;margin:0 auto;padding:10px 16px;display:grid;gap:10px;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center}
@media (max-width:700px){.bar{grid-template-columns:minmax(0,1fr) auto auto}.brand{display:none!important}}
.brand{display:grid;line-height:1.25}
.brand b{font-family:var(--d);font-size:17px}
.brand span{font-size:12px;opacity:.7}
.sbox{position:relative}
.sbox input{width:100%;border:0;border-radius:10px;padding:10px 42px 10px 14px;background:rgba(255,255,255,.1);color:var(--head-ink);font-size:16px}
[dir=ltr] .sbox input{padding:10px 14px 10px 42px}
.sbox input::placeholder{color:rgba(238,242,246,.6)}
.sbox svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.7}
.study{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:var(--head-ink);border-radius:9px;padding:8px 12px;font-size:14px;white-space:nowrap}
.study.on{background:var(--amber);border-color:var(--amber);color:#241700}
.sw{width:30px;height:16px;border-radius:9px;background:rgba(255,255,255,.3);position:relative;display:inline-block;flex:none}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:right .15s}
.study.on .sw{background:rgba(0,0,0,.25)}.study.on .sw::after{right:16px}
@media (max-width:700px){.study .t{display:none}}
.tabs{background:var(--head2);border-top:1px solid rgba(255,255,255,.08)}
.tabs-in{max-width:1100px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-inline:12px}
.tabs-in::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--head-ink);opacity:.72;padding:8px 12px 9px;white-space:nowrap;font-size:14px}
.tabs button:hover{opacity:1}
.tabs button.on{opacity:1;border-bottom-color:var(--rose);font-weight:700}
.tabs .sep{width:1px;background:rgba(255,255,255,.18);margin:8px 6px}

main{max-width:1100px;margin:0 auto;padding-block:18px 60px;padding-inline:16px;display:grid;gap:32px}
section{display:grid;gap:14px;scroll-margin-top:calc(var(--hh) + 14px)}
.sh{display:grid;gap:4px}
.sh h2{margin:0;font-size:22px}
.sh p{margin:0;color:var(--muted);max-width:75ch}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--rose)}
.notes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.note{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;display:grid;gap:2px}
.note b{font-size:14.5px}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;padding:1px 9px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
.c-ok{background:var(--sage-soft);color:var(--sage)}
.c-warn{background:var(--amber-soft);color:var(--amber)}
.c-no{background:var(--red-soft);color:var(--red)}
.c-cat{background:var(--soft);color:var(--muted)}
.studybar{background:var(--amber-soft);border-radius:10px;padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
.studybar b{font-family:var(--d)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 12px;font-size:13.5px}

.offers{display:grid;gap:10px}
.cathead{font-family:var(--d);font-size:16px;margin:10px 0 0;display:flex;gap:8px;align-items:center}
.cathead .n{font-family:var(--m);font-size:12px;color:var(--muted)}
.offer{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ohead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 16px;align-items:center;width:100%;background:none;border:0;text-align:start}
.ohead h3{margin:0;font-size:16.5px}
.ohead .en{display:block;font-size:12.5px;color:var(--muted);text-align:right}
.ohead .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.price{text-align:end;display:grid;gap:2px;justify-items:end}
.price .v{font-family:var(--m);font-size:19px;font-weight:600;white-space:nowrap}
.price .v small{font-size:12px;color:var(--muted);font-weight:500}
.price .n{font-size:12px;color:var(--muted);max-width:220px}
.hidep{display:inline-block;border:1px dashed var(--amber);color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:2px 10px;font-family:var(--f);font-size:13px;font-weight:500}
.obody{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:12px}
.two{display:grid;gap:12px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.say{background:var(--sage-soft);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.say p{margin:0;font-size:15.5px}
.qa{display:grid;gap:8px}
.qa div{display:grid;gap:2px}
.qa .q{font-weight:500}
.qa .q::before{content:"العميل: ";color:var(--muted);font-weight:400;font-size:13px}
.qa .a::before{content:"إنت: ";color:var(--sage);font-weight:700;font-size:13px}
.caution{background:var(--amber-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.caution.no{background:var(--red-soft)}
.src{font-size:12px;color:var(--muted)}

.tw{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{background:var(--soft);color:var(--muted);font-weight:500;text-align:start;padding:9px 12px;white-space:nowrap;position:sticky;top:0}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
td.m{font-family:var(--m);white-space:nowrap;font-weight:600}
tr.grp td{background:var(--soft);font-family:var(--d);font-weight:700;font-size:14px}
.empty{padding:24px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px}
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.totop{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:33;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow)}
</style>

  caution:'"الوش كله" بيشمل أنهي مناطق؟ مش مكتوب في الشيت. متحددش مناطق لحد ما التيم يأكد.'},
 {id:'dysport',cat:'botox',ar:'بوتوكس ديسبورت',en:'Dysport Botox',price:'900 / 1,299',pn:'منطقة 900 · الوش كله 1,299 (من البوستر بس)',st:'warn',slide:11,

  caution:'الأسعار دي مكتوبة على البوستر بس ومش في النص. أكّدها مع التيم قبل ما تعتمد عليها.'},

 {id:'lipfill',cat:'filler',ar:'فيلر شفايف AILEENE (1 مل)',en:'AILEENE lip filler 1 ml',price:'من 599',pn:'"يبدأ من" 599',st:'ok',slide:12,

  say:'فيلر الشفايف AILEENE الكوري بيبدأ من 599 درهم للـ 1 مل، ومعاه هدية. الدكتورة هتحدد الكمية المناسبة لشكل الشفايف.',

function parseCSV(t){ const rows=[]; let r=[],f='',q=false; for(let i=0;i<t.length;i++){ const c=t[i];
  if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
  else if(c==='"') q=true; else if(c===','){ r.push(f); f=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; r.push(f); rows.push(r); r=[]; f=''; } else f+=c; }
  if(f!==''||r.length){ r.push(f); rows.push(r); } return rows.map(x=>x.map(y=>y.trim())); }

  let h=+m[1]; const mm=m[2]?+m[2]/60:0; const ap=m[3]||''; if(/pm|م|الضهر|ظهر|العصر|عصر|المغرب|بالليل|مساء/.test(ap)&&h<12) h+=12; if(/am|ص|الصبح|صباح/.test(ap)&&h===12) h=0; return h+mm; }
function parseDate(v){ v=String(v||'').trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)); let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); } return ''; }

  sc.onerror=()=>{ cleanup(); bad(new Error('jsonp')); }; sc.src=u.replace('tqx=out:csv','tqx=out:json;responseHandler:'+cb)+'&t='+Date.now(); document.head.appendChild(sc); }); }

const norm=s=>String(s||'').toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const stChip=s=>s==='ok'?'<span class="chip c-ok">مؤكد</span>':s==='warn'?'<span class="chip c-warn">محتاج تأكيد</span>':'<span class="chip c-no">السعر مش متاح</span>';
let CAT='all', Q='', STUDY=false, OPEN=new Set(), SHOWN=new Set();
try{STUDY=localStorage.getItem('hp-offers-study')==='1'}catch(e){}

function priceHtml(o){
  if(o.price==='—') return '<span class="v">—</span>';
  if(STUDY&&!SHOWN.has(o.id)) return `<span class="hidep" data-a="reveal" data-v="${o.id}" role="button" tabindex="0">اضغط تشوف السعر</span>`;
  return `<span class="v">${esc(o.price)} <small>AED</small></span>`;
}
const hideNums=t=>String(t).replace(/\d{1,3}(,\d{3})+|\d{3,}/g,'…');
const pnT=o=>STUDY&&!SHOWN.has(o.id)?hideNums(o.pn):o.pn;
function list(){
  const q=norm(Q.trim());
  return OFFERS.filter(o=>(CAT==='all'||o.cat===CAT)&&(!q||norm([o.ar,o.en,o.what,o.who,CATS[o.cat],o.pn].join(' ')).includes(q)));
}
function renderTabs(){
  $('tabs').innerHTML=`<button data-a="jump" data-v="offers">العروض</button><button data-a="jump" data-v="prices">جدول الأسعار</button><span class="sep" aria-hidden="true"></span>`+
   [['all','الكل']].concat(Object.entries(CATS)).map(([k,t])=>`<button data-a="cat" data-v="${k}" class="${CAT===k?'on':''}">${t}</button>`).join('');
}
function render(){
  const ls=list();
  const groups=Object.keys(CATS).map(k=>[k,ls.filter(o=>o.cat===k)]).filter(g=>g[1].length);
  const hiddenCount=ls.filter(o=>o.price!=='—'&&!SHOWN.has(o.id)).length;

  $('main').innerHTML=`

    ${ls.length?`<div class="offers">${groups.map(([k,os])=>`${CAT==='all'?`<h3 class="cathead">${CATS[k]} <span class="n">${os.length}</span></h3>`:''}${os.map(o=>{const open=OPEN.has(o.id);return `<article class="offer" id="o-${o.id}">

    </tbody></table></div>`:''}</section>

   <div class="foot">آخر تحديث: ${UPDATED} · المصدر: ${esc(SRC)}. لو فيه سعر عليه علامة "محتاج تأكيد"، ارجع للتيم ليدر قبل ما تقوله.</div>`;
}
function setHH(){document.documentElement.style.setProperty('--hh',Math.round($('top').getBoundingClientRect().height)+'px')}
$('q').addEventListener('input',e=>{Q=e.target.value;render()});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t) return; const a=t.dataset.a, v=t.dataset.v;
  if(a==='toggle'){OPEN.has(v)?OPEN.delete(v):OPEN.add(v);render()}
  if(a==='cat'){CAT=v;renderTabs();render();window.scrollTo({top:0})}
  if(a==='jump'){const el=$(v); if(el) el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
  if(a==='study'){STUDY=!STUDY;SHOWN.clear();try{localStorage.setItem('hp-offers-study',STUDY?'1':'0')}catch(err){}render()}
  if(a==='reveal'){SHOWN.add(v);render()}
  if(a==='revealall'){OFFERS.forEach(o=>SHOWN.add(o.id));render()}
  if(a==='hideall'){SHOWN.clear();render()}
  if(a==='totop'){window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.a==='reveal'){e.preventDefault();e.target.click()} });
window.addEventListener('resize',setHH);
renderTabs(); render(); setHH();
if(typeof loadOfferSheets==='function') loadOfferSheets().then(ok=>{ if(ok){ renderTabs(); render(); } });
document.getElementById('langbtn').addEventListener('click',e=>{e.preventDefault();location.href=e.currentTarget.getAttribute('href')+location.hash;});

te","tier":"start","cat":"body","ar":"مساج ماديرو بالأخشاب (10 جلسات) — عرض عيد الاتحاد","en":"Madero Wood Massage (10 Sessions) — Eid Al Etihad","price":"955","oldPrice":"1,500","pn":"10 جلسات (عادي: 1,500)","st":"ok","slide":"عيد الاتحاد 55 (قسم 10)","what":"10 جلسات مساج ماديرو بالأدوات الخشبية لتصريف السوائل وتقليل السيلوليت وتنشيط الدورة الدموية.","who":"العميل بيقول: \"عندي سيلوليت / تكسير\"، \"جسمي محتبس مياه\"، \"عايزة مساج\" (عرض البداية).","say":"كورس مساج ماديرو بالأخشاب (10 جلسات) لعلاج السيلوليت واحتباس السوائل بـ 955 درهم بدل 1,500 درهم في عروض عيد الاتحاد.","qa":[],"caution":""},{"id":"eid_massage_pkg","camp":"eid55","need":"cellulite","tier":"upgrade","cat":"body","ar":"باقة المساج (10 جلسات: طبي أو ماديرو أو لمفاوي)","en":"Massage Package (10 Sessions: Medical / Madero / Lymphatic)","price":"1,500","oldPrice":"","pn":"10 جلسات: طبي أو ماديرو أو لمفاوي","st":"warn","slide":"عيد الاتحاد 55 (قسم 10)","what":"باقة 10 جلسات مساج متنوعة (طبي أو ماديرو أو لمفاوي).","who":"العميل عايز باقة مساج شاملة (طبي أو لمفاوي أو ماديرو).","say":"عندنا باقة المساج 10 جلسات (طبي أو ماديرو أو لمفاوي) بـ 1,500 درهم، وعرض مساج الماديرو لوحده 10 جلسات بـ 955 درهم.","qa":[],"caution":"منشورة على الصفحات ومش في القايمة الرسمية (القايمة الرسمية فيها ماديرو 10 جلسات بـ 955)."},{"id":"eid_cellulite","camp":"eid55","need":"cellulite","tier":"upgrade","cat":"body","ar":"كورس السيلوليت (30 جلسة) — عرض عيد الاتحاد","en":"Cellulite Course (30 Sessions) — Eid Al Etihad","price":"1,555","oldPrice":"","pn":"30 جلسة (10 جلسات ثلاثية)","st":"warn","slide":"عيد الاتحاد 55 (قسم 10)","what":"كورس علاج السيلوليت المكثف 30 جلسة (10 جلسات ثلاثية بالأجهزة والمساج).","who":"ترقية للعميلة اللي عايزة كورس مكثف (30 جلسة) لعلاج السيلوليت.","say":"كورس علاج السيلوليت المكثف (30 جلسة) متاح بـ 1,500 - 1,555 درهم، هأكدلك السعر النهائي في رسالة التأكيد.","qa":[],"caution":"انتبه: سعر العرض في بوستر عيد الاتحاد (1,555) أعلى بـ 55 درهم من قايمة 31 أكتوبر (1,500). يتأكد من الكلاينت."},{"id":"eid_laser_3","camp":"eid55","need":"laser","tier":"start","cat":"laser","ar":"ليزر فل بودي 3 جلسات (كانديلا جنتل ماكس برو بلس) — عرض عيد الاتحاد","en":"Full-Body Laser 3 Sessions (Candela GentleMax Pro Plus) — Eid Al Etihad","price":"555","oldPrice":"897","pn":"3 جلسات · عادي: 897 (3 × 299)","st":"ok","slide":"عيد الاتحاد 55 (قسم 11)","what":"باكدج 3 جلسات ليزر جسم كامل بأحدث جهاز Candela GentleMax Pro Plus.","guide":"laser","who":"العميلة بتقول: \"عايزة أشيل الشعر نهائي\"، \"تعبت من الواكس\" (عرض البداية السريع لليزر).","say":"بمناسبة عيد الاتحاد، عندنا عرض رائع على ليزر فل بودي بجهاز كانديلا جنتل ماكس برو بلس: 3 جلسات بـ 555 درهم بس بدل 897 درهم!","qa":[["وكم الـ 6 جلسات؟","لو حابة الباكدج الأكبر (6 جلسات)، متاح بـ 1,000 درهم للسيدات بدون الظهر والبطن، أو 1,500 شامل الظهر والبطن."]],"caution":"الرقم مطبوع \"A555\" في الصورة والمقصود 555 درهم (بدل 897)."},{"id":"eid_laser_men_3","camp":"eid55","need":"laser","tier":"upgrade","cat":"laser","ar":"ليزر رجال 3 جلسات (بطن وضهر وذراعات) — عرض عيد الاتحاد","en":"Men Laser 3 Sessions (Abdomen, Back & Arms) — Eid Al Etihad","price":"655","oldPrice":"","pn":"3 جلسات · للرجال (بطن + ضهر + ذراعات)","st":"ok","slide":"عيد الاتحاد 55 (قسم 11)","what":"باكدج 3 جلسات ليزر للرجال لمنطقة البطن والظهر والذراعين بجهاز Candela GentleMax Pro Plus.","guide":"laser","who":"عميل راجل بيسأل عن ليزر إزالة الشعر لمنطقة البطن والظهر والذراعين.","say":"بمناسبة عيد الاتحاد، عندنا عرض خاص للرجال: 3 جلسات ليزر (بطن وضهر وذراعات) بجهاز كانديلا جنتل ماكس برو بلس بـ 655 درهم.","qa":[["ينفع للجسم كامل للرجال؟","أيوه، متاح كمان باكدج الجسم كامل للرجال 6 جلسات (بـ 1,250 بدون الظهر والبطن، أو 1,800 شامل الظهر والبطن)."]],"caution":""},{"id":"eid_gcell","camp":"eid55","need":"hair_loss","tier":"start","cat":"skin","ar":"تقنية جي سيل (G-Cell) بديل زراعة الشعر — عرض عيد الاتحاد","en":"G-Cell Hair Regeneration (Non-Surgical) — Eid Al Etihad","price":"2,955","oldPrice":"5,000","pn":"بدون جراحة · بدلاً من 5,000","st":"ok","slide":"عيد الاتحاد 55 (قسم 12)","what":"تقنية G-Cell المتطورة لعلاج تساقط الشعر والفراغات وتكثيف الشعر بالخلايا المجهرية بدون جراحة.","who":"العميل بيقول: \"شعري بيقع\"، \"عندي فراغات / صلع\"، \"بفكر في زراعة\" (عرض البداية).","say":"لعلاج تساقط الشعر والفراغات من غير جراحة، عندنا عرض عيد الاتحاد على تقنية جي سيل (G-Cell) بـ 2,955 درهم بدل 5,000 درهم، والاستشارة مع الدكتور مجانية لتقييم فروة الرأس.","qa":[["تغنيني عن زراعة الشعر؟","تقنية G-Cell بتعالج التساقط والفراغات بدون جراحة، والدكتور في الاستشارة المجانية هيقيّم البصيلات ويقولك النتيجة المتوقعة لحالتك."]],"caution":"أول سعر معلن لـ G-Cell. متقولش \"بديل مضمون للزراعة لكل الحالات\"، قول \"علاج متطور بدون جراحة والدكتور يقيّم حالتك\"."}];
  const ENDO_QA = [["إيه هو Endolift (الإندولفت / الإندوليزر)؟","الإندولفت هو إجراء تجميلي باستخدام الليزر، بيساعد على تحسين ترهل الجلد وشدّه، وتحفيز إنتاج الكولاجين، وممكن يساعد كمان في تقليل الدهون الموضعية في بعض الحالات. وده بيتم عن طريق ألياف ليزر دقيقة جدًا بيستخدمها الدكتور تحت الجلد."],["هل الإندولفت عملية جراحية؟","لا، هو إجراء محدود التدخل، ومش عملية شد جراحي تقليدية، لكن بيتم إدخال ألياف دقيقة تحت الجلد بواسطة الدكتور."],["جهاز الإندولفت بيشتغل إزاي؟","الدكتور بيستخدم ألياف ليزر دقيقة جدًا تحت الجلد، والليزر بيوصل طاقة حرارية للأنسجة، وده بيساعد على تحفيز الكولاجين وتحسين تماسك الجلد، وممكن يساعد في الدهون الموضعية حسب الحالة."],["إيه الفرق بين الإندولفت والليزر العادي؟","الإندولفت بيعتمد على ألياف ليزر بتوصل تحت الجلد، مش مجرد ليزر بيتسلط على سطح البشرة من الخارج. لكن كل تقنية ليها استخدام مختلف حسب المشكلة اللي بنعالجها."],["ينفع أعمل Endolift للوجه؟","أيوه، ممكن يُستخدم لتحسين ترهل بعض مناطق الوجه، زي أسفل الوجه وخط الفك وتحت الذقن، حسب تقييم الدكتور."],["ينفع الإندولفت للرقبة؟","أيوه، ممكن يساعد على تحسين مظهر ترهل الجلد في الرقبة، والدكتور بيحدد مدى مناسبته للحالة."],["ينفع الإندولفت للبطن؟","ممكن يُستخدم لتحسين تماسك الجلد وبعض حالات الدهون الموضعية في البطن، لكن لو فيه ترهل شديد أو جلد زائد، ممكن يحتاج تقييم وخيارات علاج مختلفة."],["ينفع الإندولفت للأذرع (الدراعات)؟","أيوه، ممكن يُستخدم لتحسين ترهل الجلد في منطقة الذراعين، خصوصًا الجزء الداخلي، حسب الحالة."],["ينفع أعمل أكتر من منطقة في نفس الجلسة؟","ده بيتحدد حسب المناطق المطلوبة وحالة العميل ووقت الإجراء والبروتوكول الطبي. الدكتور هو اللي يحدد إمكانية علاج أكتر من منطقة مع بعض."],["هل جلسة الإندولفت مؤلمة؟","درجة الإحساس بالألم بتختلف من شخص للتاني، والدكتور بيحدد طريقة التخدير المناسبة قبل الإجراء عشان يقلل عدم الراحة أثناء الجلسة."],["هل الإندولفت محتاج تخدير؟","طريقة التخدير بتختلف حسب نوع الإجراء والمنطقة والجهاز المستخدم. الدكتور هيشرح لحضرتك الطريقة المناسبة قبل الجلسة."],["هل هحس بالليزر تحت الجلد؟","الإحساس بيختلف من شخص للتاني، وممكن يكون فيه إحساس بالضغط أو بعض عدم الراحة أثناء الإجراء، والدكتور بيتابع الحالة طول الوقت."],["الجلسة بتاخد وقت قد إيه؟","الوقت بيختلف حسب المنطقة ومساحتها وعدد المناطق اللي هتتعالج (منطقة صغيرة 30-45 دقيقة، الوش كامل 45-90 دقيقة، منطقة أكبر كالبطن من ساعة لساعتين). نقدر نأكد المدة بعد ما الدكتور يحدد تفاصيل الإجراء."],["فترة التعافي بعد جلسة الإندولفت قد إيه؟","فترة التعافي غالبًا بتكون أقصر من عمليات الشد الجراحية، لكن ممكن يحصل تورم أو كدمات أو إحساس بسيط بالألم بعد الجلسة. المدة بتختلف حسب المنطقة وطبيعة الجسم."],["أقدر أرجع شغلي تاني يوم بعد الإندولفت؟","أغلب الحالات بتقدر تباشر الأنشطة اليومية بعد انتهاء الجلسة والدكتور هيحدد لحضرتك الوقت المناسب للرجوع لأنشطتك."],["هل هيحصل تورم بعد الإندولفت؟","ممكن يحصل تورم بعد الإجراء، وبتختلف درجته ومدته من شخص للتاني ومن منطقة للتانية."],["هل ممكن تظهر كدمات بعد الجلسة؟","أيوه، ممكن تظهر كدمات بسيطة أو احمرار في المنطقة المعالجة، وده من الآثار المحتملة بعد الإجراء."],["أقدر أروح الجيم بعد جلسة الإندولفت؟","الأفضل تجنب المجهود والتمارين الشاقة في أول فترة بعد الإجراء، والالتزام بتعليمات الدكتور بخصوص موعد الرجوع للرياضة."],["أقدر أتعرض للشمس بعد الإندولفت؟","لازم الالتزام بتعليمات الدكتور بخصوص التعرض للشمس واستخدام واقي الشمس والعناية بالمنطقة المعالجة."],["نتيجة الإندولفت بتظهر إمتى؟","ممكن بعض التحسن يكون ملحوظًا في البداية، لكن النتيجة بتتطور تدريجيًا مع تكوين الكولاجين خلال الشهور التالية (من شهر لـ 3 شهور ولحد 6 شهور). وده بيختلف من حالة للتانية."],["هل نتيجة الإندولفت فورية؟","ممكن يظهر تحسن مبدئي بعد الإجراء، لكن النتيجة النهائية مش بتكون فورية بالكامل؛ لأن تحفيز الكولاجين بيستمر مع الوقت."],["نتيجة الإندولفت بتستمر قد إيه؟","مدة استمرار النتيجة بتختلف حسب طبيعة الجلد والعمر ونمط الحياة ودرجة الترهل. الدكتور يقدر يوضح لحضرتك التوقعات المناسبة لحالتك."],["هل الإندولفت بيشد الجلد فعلًا؟","هدف الإجراء هو تحسين تماسك الجلد وتقليل الترهل في الحالات المناسبة، لكن درجة التحسن بتختلف حسب حالة الجلد."],["هل الإندولفت بيخسس؟","لا، الإندولفت مش وسيلة لإنقاص الوزن أو علاج السمنة. هو إجراء تجميلي ممكن يساعد في تحسين الدهون الموضعية وشكل المنطقة في حالات مناسبة."],["هل الإندولفت بيزيل الجلد الزائد؟","مش بالضرورة. لو فيه جلد زائد أو ترهل شديد، ممكن الإجراء وحده ما يكونش كافي، والطبيب هو اللي يحدد أنسب حل."],["محتاج كام جلسة إندولفت؟ وهل جلسة واحدة كفاية؟","عدد الجلسات مش ثابت لكل العملاء؛ بيعتمد على المنطقة ودرجة الترهل وحالة الجلد والنتيجة المطلوبة. ومش نقدر نأكد إن جلسة واحدة كافية قبل تقييم الدكتور."],["سعر جلسة الإندولفت كام وليه بيختلف من منطقة للتانية؟","السعر بيعتمد على المنطقة ومساحتها وتفاصيل الإجراء (في عروض عيد الاتحاد: الذقن المزدوج بـ 1,555 درهم، وفي العروض الأساسية الوجه والرقبة 2,500 درهم والبطن 3,000 درهم). ممكن أعرف حضرتك مهتم بأي منطقة؟"],["هل إجراء الإندولفت آمن؟ وهل ممكن يحصل حروق أو تكتلات؟","هو إجراء طبي تجميلي ليه فوائد ومخاطر محتملة زي أي إجراء حراري (مثل احتمالية حروق أو عدم انتظام سطح الجلد لو اتنفذ بطريقة غير مناسبة). علشان كده الأمان بيعتمد على تقييم الدكتور لحالتك وتنفيذ الإجراء بالبروتوكول الصحيح."],["مين الأشخاص اللي ماينفعش يعملوا الإندولفت (الحمل، الرضاعة، السكر، أدوية السيولة)؟","مش كل الحالات مناسبة؛ لازم إبلاغ الدكتور بالحمل أو الرضاعة أو مرض السكر أو أدوية السيولة أو أي مشاكل في الجلد وتجلط الدم، والدكتور هو اللي يحدد إمكانية الإجراء أو تأجيله."],["إيه الفرق بين Endolift وHIFU (الهايفو)؟","الاتنين تقنيات مختلفة لتحسين شد الجلد، لكن طريقة توصيل الطاقة والأنسجة المستهدفة بتختلف (الإندولفت بألياف ليزر دقيقة تحت الجلد). الطبيب يقدر يحدد أنهي تقنية أنسب لحالتك."],["إيه الفرق بين Endolift وشفط الدهون أو عملية شد الوجه والبطن؟","الإندولفت بيعتمد على طاقة الليزر بألياف دقيقة تحت الجلد ومش بديل للجراحة في كل الحالات (لو الترهل شديد أو فيه جلد زائد كبير الجراحة بتكون خيار مختلف)، أما شفط الدهون فهو إزالة للدهون بالشفط. الدكتور هو اللي يحدد الأنسب."],["أنا خايف من إجراء الإندولفت / محتاج أفكر / هل فيه ضمان للنتيجة؟","ده طبيعي جدًا ومن حقك تعرف كل التفاصيل وتاخد وقتك. مفيش إجراء تجميلي مضمون 100% لأن الاستجابة بتختلف من شخص للتاني، عشان كده نقدر نرتب لحضرتك استشارة مجانية مع الدكتور يشرحلك الخطوات والنتيجة المتوقعة لحالتك قبل أي قرار."]];
