<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Tres Jolie Agent Handbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F5F6F8; --paper:#FFFFFF; --soft:#EFF1F4; --ink:#18222E; --muted:#5B6674; --line:#DADFE6;
  --rose:#A63D63; --rose-soft:#F8E6ED; --sage:#2F7565; --sage-soft:#E0F0EB; --amber:#A8660C; --amber-soft:#FCEFD8; --red:#B83A2E; --red-soft:#FBE3E0; --blue:#2C6395; --blue-soft:#E2EDF7;
  --head:#1D2B3A; --head2:#263849; --head-ink:#EEF2F6; --shadow:0 12px 32px rgba(20,30,45,.18);
  --hh:112px;
  --f:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif; --d:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif; --m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#10161D; --paper:#18212B; --soft:#1F2A36; --ink:#E6EBF0; --muted:#9AA6B3; --line:#2C3947;
  --rose:#E07BA0; --rose-soft:#3A2230; --sage:#5DC0A6; --sage-soft:#17332C; --amber:#E9AE52; --amber-soft:#3A2C15; --red:#EE7F73; --red-soft:#3C201D; --blue:#7DB3E6; --blue-soft:#1A2B3C; --head:#0B1117; --head2:#141E28; --head-ink:#E6EBF0; --shadow:0 12px 32px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#10161D; --paper:#18212B; --soft:#1F2A36; --ink:#E6EBF0; --muted:#9AA6B3; --line:#2C3947;
  --rose:#E07BA0; --rose-soft:#3A2230; --sage:#5DC0A6; --sage-soft:#17332C; --amber:#E9AE52; --amber-soft:#3A2C15; --red:#EE7F73; --red-soft:#3C201D; --blue:#7DB3E6; --blue-soft:#1A2B3C; --head:#0B1117; --head2:#141E28; --head-ink:#E6EBF0; --shadow:0 12px 32px rgba(0,0,0,.5)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--f)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate}
.m{font-family:var(--m);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--d);text-wrap:balance;line-height:1.35}

/* ===== sticky header: search + section tabs (always visible) ===== */
.top{background:var(--head);color:var(--head-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.bar{max-width:1320px;margin:0 auto;padding:10px 16px;display:grid;gap:10px;grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
@media (max-width:760px){.bar{grid-template-columns:minmax(0,1fr) auto}.brand{display:none!important}}
.brand{display:grid;line-height:1.25}
.brand b{font-family:var(--d);font-size:17px}
.brand span{font-size:12px;opacity:.7}
.sbox{position:relative}
.sbox input{width:100%;border:0;border-radius:10px;padding:10px 42px 10px 44px;background:rgba(255,255,255,.1);color:var(--head-ink);font-size:16px}
.sbox input::placeholder{color:rgba(238,242,246,.6)}
.sbox svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.7}
.sbox kbd{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:var(--m);font-size:12px;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:0 6px;opacity:.7}
.results{position:absolute;inset-inline:0;top:calc(100% + 6px);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow-y:auto;z-index:40}
.results button{display:grid;gap:1px;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px}
.results button:hover,.results button.on{background:var(--soft)}
.results .sec{font-size:11.5px;color:var(--rose);font-weight:700}
.results .snip{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:6px}
.tbtn{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:var(--head-ink);border-radius:9px;padding:8px 12px;font-size:14px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tbtn:hover{background:rgba(255,255,255,.14)}
.tbtn.on{background:var(--rose);border-color:var(--rose);color:#fff}
@media (max-width:760px){.tbtn .t{display:none}}
.tabs{background:var(--head2);border-top:1px solid rgba(255,255,255,.08)}
.tabs-in{max-width:1320px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-inline:12px}
.tabs-in::-webkit-scrollbar{display:none}
.tabs a{color:var(--head-ink);opacity:.72;text-decoration:none;padding:8px 12px 9px;white-space:nowrap;font-size:14px;border-bottom:3px solid transparent}
.tabs a:hover{opacity:1}
.tabs a.on{opacity:1;border-bottom-color:var(--rose);font-weight:700}
.tabs .cnt{font-family:var(--m);font-size:11.5px;opacity:.7;margin-inline-start:4px}

/* ===== layout ===== */
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 60px;padding-inline:16px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px;align-items:start}
.wrap.drawer-open{grid-template-columns:minmax(0,1fr) 380px}
@media (max-width:1080px){.wrap,.wrap.drawer-open{grid-template-columns:1fr}}
main{display:grid;gap:36px;min-width:0;order:1}
aside.rail{order:2;position:sticky;top:calc(var(--hh) + 12px + env(safe-area-inset-top,0px));max-height:calc(100vh - var(--hh) - 24px);overflow-y:auto;display:grid;gap:12px;align-content:start}
@media (max-width:1080px){aside.rail{position:fixed;inset:auto 0 0 0;top:auto;max-height:78vh;z-index:35;background:var(--bg);border-top:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px 14px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  aside.rail.closed{display:none}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.panel h3{margin:0;font-size:14.5px}
.pins a{display:flex;justify-content:space-between;gap:8px;color:var(--ink);text-decoration:none;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.pins a:last-child{border-bottom:0}
.pins .p{font-family:var(--m);font-size:12.5px;color:var(--muted);white-space:nowrap}
section{display:grid;gap:14px;scroll-margin-top:calc(var(--hh) + 16px)}
.sh{display:grid;gap:4px}
.sh h2{margin:0;font-size:22px}
.sh p{margin:0;color:var(--muted);max-width:75ch}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--rose)}

/* quick answers */
.quick{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.qa-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;text-align:start;align-content:start}
.qa-card:hover{border-color:var(--rose)}
.qa-card .k{font-size:12px;color:var(--muted)}
.qa-card b{font-family:var(--d);font-size:15px}
.qa-card span{font-size:13.5px}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
.c-ok{background:var(--sage-soft);color:var(--sage)}
.c-warn{background:var(--amber-soft);color:var(--amber)}
.c-no{background:var(--red-soft);color:var(--red)}
.c-cat{background:var(--soft);color:var(--muted)}

.rules{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.rule{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.rule b{font-size:14.5px}
.rule span{font-size:13.5px;color:var(--muted)}
.rule.no b{color:var(--red)}
.rule.yes b{color:var(--sage)}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:4px 12px;font-size:13.5px}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.offers{display:grid;gap:12px}
.offer{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;scroll-margin-top:calc(var(--hh) + 16px)}
.flash{box-shadow:0 0 0 3px var(--rose)!important}
.ohead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 16px;align-items:start}
.ohead .tt{display:grid;gap:2px;cursor:pointer;text-align:start;background:none;border:0;padding:0}
.ohead h3{margin:0;font-size:17px}
.ohead .en{font-size:12.5px;color:var(--muted);text-align:right}
.ohead .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.price{text-align:end;display:grid;gap:4px;justify-items:end}
.price .v{font-family:var(--m);font-size:20px;font-weight:600;white-space:nowrap}
.price .v small{font-size:12px;color:var(--muted);font-weight:500}
.price .n{font-size:12px;color:var(--muted);max-width:210px}
.price .acts{display:flex;gap:4px}
.ib{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:2px 8px;font-size:12.5px;display:inline-flex;gap:4px;align-items:center}
.ib:hover{border-color:var(--rose)}
.ib.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.obody{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:14px}
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.say{background:var(--sage-soft);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.say p{margin:0;font-size:15.5px}
.say .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.copy{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:1px 9px;font-size:12px}
.caution{background:var(--amber-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.caution.no{background:var(--red-soft)}
.qa{display:grid;gap:8px}
.qa div{display:grid;gap:2px}
.qa .q{font-weight:500}
.qa .q::before{content:"العميل: ";color:var(--muted);font-weight:400;font-size:13px}
.qa .a::before{content:"إنت: ";color:var(--sage);font-weight:700;font-size:13px}
.src{font-size:12px;color:var(--muted)}

.tw{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--soft);color:var(--muted);font-weight:500;text-align:start;padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
td.m{white-space:nowrap}

.flows{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.flow{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;align-content:start;scroll-margin-top:calc(var(--hh) + 16px)}
.flow h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.flow ol{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.flow li::marker{font-family:var(--m);color:var(--rose)}
.line{display:block;background:var(--soft);border-radius:6px;padding:2px 8px;margin-top:3px;font-size:14px}

.objs{display:grid;gap:10px}
.obj{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:8px;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);align-items:start;scroll-margin-top:calc(var(--hh) + 16px)}
@media (max-width:700px){.obj{grid-template-columns:1fr}}
.obj.hot{border-color:var(--amber);box-shadow:inset -4px 0 0 var(--amber)}
.obj .cq{font-family:var(--d);font-size:15.5px;display:grid;gap:4px;justify-items:start}
.obj .cq small{font-family:var(--f);font-size:12px;color:var(--muted)}
.obj .ans{display:grid;gap:6px}
.obj .avoid{font-size:13.5px;color:var(--red)}
ol.steps{margin:0;padding-inline-start:20px;display:grid;gap:3px;font-size:14px}

.gl{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.g{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.g b{font-family:var(--d);font-size:16px}
.g span{font-size:14px}
.g i{font-style:normal;font-size:12.5px;color:var(--muted);text-align:right}
.todo{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 16px 6px 36px;margin:0}
.todo li{padding:8px 0;border-bottom:1px dashed var(--line)}
.todo li:last-child{border-bottom:0}
.log{display:grid;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
.log div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.log div:last-child{border-bottom:0}
.log span{color:var(--muted);font-size:13px}
.prod{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;scroll-margin-top:calc(var(--hh) + 16px)}
.phead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;background:var(--soft);border-bottom:1px solid var(--line)}
.phead h3{margin:0;font-size:19px}
.phead .en{display:block;font-size:12.5px;color:var(--muted);text-align:right}
.pchips{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.pchips a{text-decoration:none;color:var(--ink)}
.pbody{padding:14px 16px;display:grid;gap:14px}
.pp{margin:2px 0 0}
ul.tick{margin:2px 0 0;padding-inline-start:18px;display:grid;gap:2px}
.facts2{margin:2px 0 0;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.facts2 div{background:var(--blue-soft);border-radius:10px;padding:8px 12px}
.facts2 dt{font-weight:700;font-size:13.5px}
.facts2 dd{margin:0;font-size:14.5px}
.phr{display:grid;gap:8px}
.phr .say .row{justify-content:flex-end}
.chat{display:grid;gap:8px}
.chatlog{display:grid;gap:10px;align-content:start;max-height:min(58vh,560px);overflow-y:auto;padding:2px}
@media (max-width:1080px){.chatlog{max-height:48vh}}
.cm{border-radius:12px;padding:9px 12px;font-size:14.5px;display:grid;gap:6px;max-width:100%}
.cm.u{justify-self:end;background:var(--rose);color:#fff;border-end-end-radius:3px;max-width:85%}
.cm.b{justify-self:start;background:var(--soft);border-end-start-radius:3px}
.cm .say{background:var(--paper)}
.cm .say p{font-size:14.5px}
.cm .pr{font-family:var(--m);font-size:20px;font-weight:600}
.cm .pr small{font-size:12px;color:var(--muted)}
.cm .hd{font-family:var(--d);font-weight:700;font-size:15px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cm ul,.cm ol{margin:0;padding-inline-start:18px;display:grid;gap:2px}
.cm .no{color:var(--red);font-size:13.5px}
.cm .warn{background:var(--amber-soft);border-radius:8px;padding:6px 10px;font-size:13.5px}
.cm .acts{display:flex;gap:6px;flex-wrap:wrap}
.chips2{display:flex;gap:6px;flex-wrap:wrap}
.chips2 button{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:3px 10px;font-size:13px;text-align:start}
.chips2 button:hover{border-color:var(--rose)}
.cin{display:flex;gap:6px}
.csug{border:1px solid var(--line);border-radius:10px;background:var(--paper);margin-bottom:6px;max-height:240px;overflow:auto;display:grid}
.csug[hidden]{display:none}
.csug .csh{font-size:12px;color:var(--muted);padding:6px 10px 2px}
.csug button{all:unset;cursor:pointer;padding:7px 10px;font-size:14px;display:flex;gap:8px;align-items:baseline;border-top:1px solid var(--line)}
.csug button:hover,.csug button.on{background:var(--soft)}
.csug .sec{font-size:11.5px;color:var(--rose);white-space:nowrap}
.cin input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);font-size:15px}
.branches{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.branch{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;scroll-margin-top:calc(var(--hh) + 16px)}
.bhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px;background:var(--soft);border-bottom:1px solid var(--line)}
.bhead h3{margin:2px 0 0;font-size:18px}
.bhead .en{display:block;font-size:12.5px;color:var(--muted);text-align:right}
.bbody{padding:14px 16px;display:grid;gap:12px}
.bstat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:14px;padding:2px 10px;white-space:nowrap;align-self:flex-start}
.bstat::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.bstat.on{background:var(--sage-soft);color:var(--sage)}
.bstat.off{background:var(--soft);color:var(--muted)}
table.hours{border-collapse:collapse;font-size:14px;width:auto}
table.hours td{padding:4px 0;border:0;padding-inline-end:18px}
.small{font-size:13px}
a.ib{color:var(--ink);text-decoration:none}
.bphoto{margin:0;display:grid;gap:4px}
.bphoto img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.bphoto figcaption{font-size:12.5px;color:var(--muted)}
.bstrip{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.bmini{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:start}
.bmini:hover{border-color:var(--rose)}
ol.tline2{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:0;border-inline-start:3px solid var(--rose-soft)}
ol.tline2 li{display:grid;gap:1px;padding:6px 14px;position:relative}
ol.tline2 li::before{content:"";position:absolute;right:-7px;top:12px;width:11px;height:11px;border-radius:50%;background:var(--rose)}
ol.tline2 b{font-size:14px}
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* ===== assistant drawer tools ===== */
.dtabs{display:flex;gap:4px;background:var(--soft);border-radius:10px;padding:3px}
.dtabs button{flex:1;border:0;background:none;border-radius:8px;padding:6px 4px;font-size:13.5px}
.dtabs button.on{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dhead b{font-family:var(--d)}
.x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}
.sel{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);width:100%}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sage);transition:width .2s}
.ck{display:grid;gap:2px}
.ck label{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;padding:5px 4px;border-radius:6px;font-size:14px;cursor:pointer}
.ck label:hover{background:var(--soft)}
.ck input{accent-color:var(--sage);margin-top:4px}
.ck label.done span{color:var(--muted);text-decoration:line-through}
.ck .say-sm{display:block;font-size:13px;color:var(--sage);text-decoration:none!important}
.ck h4{margin:8px 0 2px;font-size:12.5px;color:var(--rose)}
.timer{font-family:var(--m);font-size:18px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.qrow:last-child{border-bottom:0}
.qrow .p{font-family:var(--m);font-size:13px;color:var(--muted)}

function norm(s){return String(s||'').toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))}
let INDEX=[];
function buildIndex(){
  INDEX=[];
  OFFERS.forEach(o=>INDEX.push({sec:'العروض · '+CATS[o.cat],title:o.ar,sub:o.price+' AED · '+o.pn,go:'o-'+o.id,text:[o.ar,o.en,o.what,o.who,o.say,o.caution,o.qa.map(x=>x.join(' ')).join(' '),CATS[o.cat]].join(' ')}));
  OBJ.forEach((x,i)=>INDEX.push({sec:x[4]?'الاعتراضات · الأكتر تكراراً':'الاعتراضات',title:x[0],sub:x[2],go:'obj-'+i,text:x.slice(0,4).join(' ')+' '+(x[5]||[]).join(' ')}));
  FLOWS.forEach((f,i)=>INDEX.push({sec:'خطوات المكالمة',title:f.t,sub:f.steps[0][0],go:'flow-'+i,text:f.t+' '+f.steps.map(s=>s.join(' ')).join(' ')}));
  DISP.forEach((d,i)=>INDEX.push({sec:'نتيجة المكالمة',title:d[0],sub:d[1],go:'disp',text:d.join(' ')}));
  GULF.forEach(g=>INDEX.push({sec:'قاموس الخليجي',title:g[0],sub:'= '+g[1],go:'gulf',text:g.join(' ')}));
  TERMS.forEach(t=>INDEX.push({sec:'المصطلحات',title:t[0],sub:t[2],go:'terms',text:t.join(' ')}));
  RULES.forEach(r=>INDEX.push({sec:'قواعد الكلام عن الأسعار',title:r[1],sub:r[2],go:'rules',text:r.join(' ')}));
  CENTER.forEach(c=>INDEX.push({sec:'معلومات المركز',title:c[0],sub:c[1],go:'center',text:c.join(' ')}));
  INDEX.forEach(e=>e.n=norm(e.text+' '+e.title));
}
function search(q){
  let terms=norm(q).split(/\s+/).filter(Boolean); if(!terms.length) return [];
  terms=terms.map(t=>{const s=Object.keys(SYN).find(k=>norm(k)===t||t.startsWith(norm(k))); const alts=s?[t,...norm(SYN[s]).split(' ')]:[t]; if(t.length>=3&&!INDEX.some(e=>e.n.includes(t))) fuzzy(t).forEach(w=>alts.push(w)); return alts});
  return INDEX.map(e=>{let sc=0; for(const alts of terms){ const hit=alts.some(a=>e.n.includes(a)); if(!hit) return null; if(alts.some(a=>norm(e.title).includes(a))) sc+=3; else sc+=1; } return {e,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,12).map(x=>x.e);
}

let VIEW='home';
function viewOf(t){
  for(const [v,,secs] of VIEWS){ if(v===t||secs.includes(t)) return v; }
  if(/^o-/.test(t)) return 'offers'; if(/^p-/.test(t)) return 'services'; if(/^(obj|flow)-/.test(t)) return 'calls'; if(/^br-/.test(t)) return 'branches';
  return null;
}
function uaeParts(){ const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dubai',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()); const g=t=>(f.find(x=>x.type===t)||{}).value; return {wd:g('weekday'),h:+g('hour'),m:+g('minute')}; }
function tzDiff(){ try{ const d=new Date(); const o=z=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:z,hour:'2-digit',hourCycle:'h23',day:'2-digit'}).formatToParts(d);return (+p.find(x=>x.type==='day').value)*24+(+p.find(x=>x.type==='hour').value)}; return o('Asia/Dubai')-o('Africa/Cairo'); }catch(e){return 1} }
const hh=h=>h===12?'12 الضهر':h<12?h+' الصبح':(h-12)+' بالليل';
function branchStatus(b){ const t=uaeParts(); const mins=t.h*60+t.m;
  if(t.wd==='Fri') return {open:false,txt:'مقفول النهارده (الجمعة) · بيفتح السبت '+hh(b.open)};
  if(mins>=b.open*60&&mins<b.close*60) return {open:true,txt:'مفتوح دلوقتي · بيقفل '+hh(b.close)};
  if(mins<b.open*60) return {open:false,txt:'مقفول دلوقتي · بيفتح النهارده '+hh(b.open)};
  return {open:false,txt:'مقفول دلوقتي · بيفتح '+(t.wd==='Thu'?'السبت ':'بكرة ')+hh(b.open)}; }

function lev(a,b,max){ if(Math.abs(a.length-b.length)>max) return max+1; let p=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){ const c=[i]; let mn=i; for(let j=1;j<=b.length;j++){ c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); if(c[j]<mn) mn=c[j]; } if(mn>max) return max+1; p=c; } return p[b.length]; }
function botVocab(){ if(BOT.vocab) return BOT.vocab; const v=new Set(); botItems().forEach(it=>it.ws.forEach(w=>{ if(w.length>1) v.add(w); })); Object.keys(SYN).forEach(k=>v.add(norm(k))); BOT.vocab=v; BOT.vlist=[...v]; return v; }
// closest real words for a misspelled word (1 typo for short words, 2 for long ones)
function fuzzy(t){ const V=botVocab(); if(V.has(t)||t.length<3) return []; const max=t.length>=7?2:1; const out=[];
  for(const w of BOT.vlist){ if(w[0]!==t[0]&&t.length<5) continue; const d=lev(t,w,max); if(d<=max) out.push([d,w]); }
  return out.sort((a,b)=>a[0]-b[0]||a[1].length-b[1].length).slice(0,3).map(x=>x[1]); }
// words that start with what the agent typed so far
function completions(t){ botVocab(); if(t.length<2) return []; return BOT.vlist.filter(w=>w.length>t.length&&w.startsWith(t)).sort((a,b)=>a.length-b.length).slice(0,8); }
function botTokens(q,live){
  const raw=norm(q).replace(/[؟?!.,،:؛"'()]/g,' ').split(/\s+/).filter(Boolean);
  const endsOpen=live&&!/\s$/.test(q);
  const toks=raw.filter((t,i)=>!(STOP.has(t)&&!(endsOpen&&i===raw.length-1))&&(t.length>1||(endsOpen&&i===raw.length-1)));
  return toks.map((t,i)=>{ const alts=new Set([t]);
    if(endsOpen&&i===toks.length-1) completions(t).forEach(w=>alts.add(w));
    fuzzy(t).forEach(w=>alts.add(w));
    if(t.length>3&&t.startsWith('ال')) alts.add(t.slice(2));
    if(t.length>3&&(t.startsWith('و')||t.startsWith('ب'))) alts.add(t.slice(1));
    if(t.length>4&&t.startsWith('بال')) alts.add(t.slice(3));
    const bases=[...alts]; Object.keys(SYN).forEach(k=>{ const nk=norm(k); if(bases.some(b=>nk===b||(b.length>3&&b.startsWith(nk)))) norm(SYN[k]).split(' ').forEach(x=>x&&alts.add(x)); });
    return [...alts]; });
}
function botScore(toks,nq,wantPrice,wantObj,wantDisp){
  return botItems().map(it=>{ let sc=0,hit=0;
    const has=(ws,a)=>ws.some(w=>w===a||(a.length>=4&&w.startsWith(a))||(w.length>=4&&a.startsWith(w)));
    toks.forEach(alts=>{ if(alts.some(a=>has(it.wt,a))){sc+=3;hit++} else if(alts.some(a=>has(it.ws,a))){sc+=1;hit++} });
    if(!hit) return null;
    if(wantPrice&&(it.type==='offer'||it.type==='product')) sc+=3;
    if(wantObj&&(it.type==='obj'||it.type==='pobj')) sc+=3;
    if(wantDisp&&it.type==='disp') sc+=3;
    if(it.type==='obj'&&it.ref[4]) sc+=0.5;
    if(it.type==='branch'&&BR_RE.test(nq)) sc+=4;
    if(it.type==='branch'){ const cityHit=(/فجير/.test(nq)&&it.ref.id==='fuj')||(/ابوظبي|ابو ظبي/.test(nq)&&it.ref.id==='ad'); if(cityHit) sc+=2; }
    if(it.type==='prep'&&!PREP_RE.test(nq)) sc-=3;
    if(it.type==='todo') sc-=1;
    if(/دكتور/.test(nq)&&/مين|اسم|مواعيد|موجود|متاح|امتي|بتيجي|يوم/.test(nq)&&/ياسمين|روجينا/.test((it.title||'')+' '+(it.text||''))) sc+=4;
    if(/تغذيه|روجينا|دايت/.test(nq)&&/روجينا/.test((it.title||'')+' '+(it.text||''))) sc+=4;
    sc+=hit/toks.length;
    return {it,sc};
  }).filter(Boolean).sort((a,b)=>b.sc-a.sc);
}
function botSuggest(q){
  const nq=norm(q.trim()); if(nq.length<2) return [];
  const toks=botTokens(q,true); if(!toks.length) return [];
  const wantPrice=PRICE_RE.test(nq), wantObj=OBJ_RE.test(nq), wantDisp=DISP_RE.test(nq);
  const seen=new Set(), out=[];
  const raw=nq.replace(/[؟?!.,،:؛"'()]/g,' ').split(/\s+/).filter(t=>t.length>1&&!STOP.has(t)).map(t=>t.replace(/^(ال|بال|وال)/,''));
  const ranked=botScore(toks,nq,wantPrice,wantObj,wantDisp).map(x=>{ const tn=norm(x.it.title); let b=0; raw.forEach(t=>{ if(t.length>1&&tn.includes(t)) b+=3; }); if(x.it.type==='todo') b-=2; return {it:x.it,sc:x.sc+b}; }).sort((p,q)=>q.sc-p.sc);
  for(const x of ranked){ if(x.sc<1) break; const k=x.it.type+'|'+x.it.title; if(seen.has(k)) continue; seen.add(k); out.push(x.it); if(out.length>=6) break; }
  return out;
}
function botAsk(q){
  const nq=norm(q.trim());
  if(!nq) return null;
  const toks=botTokens(q);
  if(GREET_RE.test(nq)&&toks.length<=1) return {kind:'greet'};
  if(MED_RE.test(nq)) return {kind:'medical',q:nq};
  if(THANKS_RE.test(nq)&&toks.length<=2) return {kind:'thanks'};
  if(!toks.length) return {kind:'none'};
  const wantPrice=PRICE_RE.test(nq)&&!/(كام|كم) ?جلس|عدد|مده|كام يوم|كام شهر/.test(nq), wantObj=OBJ_RE.test(nq), wantDisp=DISP_RE.test(nq);
  const scored=botScore(toks,nq,wantPrice,wantObj,wantDisp);
  if(!scored.length||scored[0].sc<1.5) return {kind:'none',sugg:scored.slice(0,3).map(x=>x.it)};
  const best=scored[0].it;
  const more=scored.slice(1).filter(x=>x.sc>=Math.max(2,scored[0].sc*0.5)&&x.it.title!==best.title).slice(0,3).map(x=>x.it);
  return {kind:'hit',best,more};
}

      h=`<div class="hd">${esc(o.ar)} ${stChip(o.st)}</div>${o.price==='—'?'<div class="warn">السعر مش متاح في المصدر. متقولش أي رقم، وقول "هأكدلك السعر قبل الحجز".</div>':`<div class="pr">${esc(o.price)} <small>AED</small></div>`}<span class="small">${esc(o.pn)}</span>${o.st==='warn'?'<div class="warn">السعر ده محتاج تأكيد. قول "هأكدلك السعر قبل الحجز".</div>':''}${sayBox(o.say)}${o.caution?`<div class="warn"><b>خلي بالك:</b> ${esc(o.caution)}</div>`:''}<div class="acts">${go('o-'+o.id)}${o.guide?go('p-'+o.guide,'دليل المنتج'):''}</div>`; break; }

    case 'obj': { const x=it.ref; h=`<div class="hd">${esc(x[0])}${x[4]?' <span class="chip c-warn">الأكتر تكراراً</span>':''}</div>${x[5]?`<ol>${x[5].map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`:''}${sayBox(x[2],'قول')}<div class="no">متقولش: ${esc(x[3])}</div><div class="acts">${go('obj-'+it.i)}</div>`; break; }
    case 'pobj': h=`<div class="hd">${esc(it.ref.name)}</div><span><b>العميل:</b> ${esc(it.qa[0])}</span>${sayBox(it.qa[1],'رد كده')}<div class="acts">${go('p-'+it.ref.id,'دليل المنتج')}</div>`; break;

    case 'flow': { const f=it.ref; h=`<div class="hd">${esc(f.t)}</div><ol>${f.steps.map(x=>`<li>${esc(x[0])}</li>`).join('')}</ol><div class="acts"><button class="ib" data-a="useflow" data-v="${it.i}">☎ افتحها في مساعد المكالمة</button>${go('flow-'+it.i)}</div>`; break; }
    case 'disp': { const d=it.ref; h=`<div class="hd">اختار في السيستم:</div><b class="ltr">${esc(d[0])}</b><span>تختاره لما: ${esc(d[1])}</span><span>لازم تملا: ${esc(d[2])}</span><div class="acts"><button class="ib" data-a="drawer" data-v="wiz">✓ مش متأكد؟ جاوب على الأسئلة</button></div>`; break; }

    case 'prep': h=`<div class="hd">قبل جلسة الليزر</div><ol>${PREP.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="acts"><button class="ib" data-a="copy" data-t="${esc('تعليمات قبل جلسة الليزر:\n'+PREP.map((x,i)=>(i+1)+'. '+x).join('\n'))}">نسخ التعليمات</button>${go('prep')}</div>`; break;
    case 'todo': h=`<div class="hd">لسه مش متأكد من الكلاينت</div><span>${esc(it.ref)}</span><div class="warn">قول للعميل "هأكدلك المعلومة دي قبل الحجز"، وارجع للتيم ليدر.</div>`; break;
    case 'center': h=`<div class="hd">${esc(it.ref[0])} ${it.ref[2]==='ok'?'<span class="chip c-ok">مؤكد</span>':'<span class="chip c-warn">محتاج تأكيد</span>'}</div><span>${esc(it.ref[1])}</span>`; break;
  }
  if(r.more&&r.more.length) h+=`<div class="lbl">أسئلة قريبة:</div><div class="chips2">${r.more.map(x=>`<button data-a="bq" data-t="${esc(x.title)}">${esc(x.title)}</button>`).join('')}</div>`;
  return h;
}
const BOT_CHIPS=['عنوان فرع أبوظبي','الفجيرة بتقفل الساعة كام؟','تعليمات قبل الليزر','الليزر بكام؟','العميل بيقول ما في موعد','عملت جلسات ومفيش نتيجة','الفرق بين نابوتا وديسبورت','سكلبترا كام جلسة؟','العميلة حامل وعايزة ليزر','العميل قال شيلوا رقمي','يعني إيه باجر؟','أسجل إيه لو محدش رد؟'];
function drawerChat(){
  const log=BOT.msgs.length?BOT.msgs.map(m=>m.u?`<div class="cm u">${esc(m.u)}</div>`:`<div class="cm b">${m.h}</div>`).join(''):`<div class="cm b"><span>اكتب سؤالك زي ما بتفكر فيه، بالمصري أو بكلام العميل الخليجي. هرد عليك من الدليل بس، ولو الإجابة مش موجودة هقولك.</span><div class="chips2">${BOT_CHIPS.map(c=>`<button data-a="bq" data-t="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>`;
  return `<div class="dhead"><b>اسأل الدليل</b>${BOT.msgs.length?'<button class="btn" data-a="bclear">مسح</button>':''}</div>
   <div class="chat"><div class="chatlog" id="chatlog">${log}</div>
   <div class="csug" id="csug" hidden></div><form class="cin" id="cform" autocomplete="off"><input id="cq" placeholder="مثلاً: سعر الفيلر؟ أو العميل بيقول غالي" aria-label="سؤالك"><button class="btn pri" type="submit">اسأل</button></form></div>`;
}
const SUGTYPE={offer:'عرض',oqa:'سؤال عميل',obj:'اعتراض',product:'خدمة',pqa:'سؤال عميل',pobj:'اعتراض',rule:'قاعدة',center:'المركز',branch:'فرع',prep:'تعليمات',disp:'نتيجة مكالمة',todo:'محتاج تأكيد',flow:'سكريبت',gulf:'خليجي',term:'مصطلح'};
let SUG=[],SUGI=-1;
function showSug(){ const i=$('cq'), b=$('csug'); if(!i||!b) return; SUG=botSuggest(i.value); SUGI=-1;
  if(!SUG.length){ b.hidden=true; b.innerHTML=''; return; }
  b.innerHTML='<div class="csh">اقتراحات (دوس على أي واحد):</div>'+SUG.map((it,k)=>`<button type="button" data-a="sug" data-i="${k}"><span class="sec">${esc(SUGTYPE[it.type]||'')}</span>${esc(it.title)}${/^(oqa|pqa|pfact|pobj)$/.test(it.type)&&it.ref?`<small style="color:var(--muted)"> · ${esc(it.ref.ar||it.ref.name||'')}</small>`:''}</button>`).join('');
  b.hidden=false; }
function pickSug(k){ const it=SUG[k]; if(!it) return; BOT.msgs.push({u:it.title}); BOT.msgs.push({h:botAnswerHtml({kind:'hit',best:it,more:[]})}); SUG=[];
  renderRail(); const l=$('chatlog'); if(l) l.scrollTop=l.scrollHeight; }
document.addEventListener('input',e=>{ if(e.target.id==='cq'){ clearTimeout(showSug.h); showSug.h=setTimeout(showSug,120); } });
document.addEventListener('keydown',e=>{ if(e.target.id!=='cq'||!SUG.length) return; const b=$('csug'); if(!b||b.hidden) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); SUGI=(SUGI+(e.key==='ArrowDown'?1:-1)+SUG.length)%SUG.length; [...b.querySelectorAll('button')].forEach((x,k)=>x.classList.toggle('on',k===SUGI)); }
  else if(e.key==='Enter'&&SUGI>=0){ e.preventDefault(); pickSug(SUGI); }
  else if(e.key==='Escape'){ b.hidden=true; } });
function botSend(q){
  q=String(q||'').trim(); if(!q) return;
  BOT.msgs.push({u:q}); const r=botAsk(q); BOT.msgs.push({h:botAnswerHtml(r||{kind:'none'})});
  if(BOT.msgs.length>40) BOT.msgs=BOT.msgs.slice(-40);
  renderRail(); const l=$('chatlog'); if(l) l.scrollTop=l.scrollHeight; const i=$('cq'); if(i&&!matchMedia('(max-width:1080px)').matches) i.focus();
}
document.addEventListener('submit',e=>{ if(e.target.id==='cform'){ e.preventDefault(); botSend($('cq').value); } });
function renderRail(){
  const r=$('rail'); const narrow=matchMedia('(max-width:1080px)').matches;
  r.classList.toggle('closed',narrow&&!DRAWER);
  $('wrap').classList.toggle('drawer-open',!!DRAWER);
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('on',b.dataset.v===DRAWER));
  const tool=DRAWER?`<div class="panel"><div class="dtabs">${[['chat','اسأل'],['call','المكالمة'],['quote','الحاسبة'],['wiz','النتيجة']].map(([k,t])=>`<button data-a="drawer" data-v="${k}" class="${DRAWER===k?'on':''}">${t}</button>`).join('')}<button data-a="drawer" data-v="" aria-label="اقفل" title="اقفل">×</button></div>${DRAWER==='chat'?drawerChat():DRAWER==='call'?drawerCall():DRAWER==='quote'?drawerQuote():drawerWiz()}</div>`:'';
  r.innerHTML=tool+(narrow&&DRAWER?'':railPins())+(!DRAWER&&!narrow?`<div class="panel"><h3>أدوات المكالمة</h3><button class="btn pri" data-a="drawer" data-v="chat">💬 اسأل الدليل</button><button class="btn" data-a="drawer" data-v="call">☎ مساعد المكالمة (تشيك ليست)</button><button class="btn" data-a="drawer" data-v="quote">＋ حاسبة الأسعار</button><button class="btn" data-a="drawer" data-v="wiz">✓ اختار نتيجة المكالمة</button></div>`:'');
}
const mm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
function toast(t){$('toast').innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toast.h);toast.h=setTimeout(()=>$('toast').innerHTML='',1800)}
function copyText(t,ok){try{navigator.clipboard.writeText(t).then(()=>toast(ok||'اتنسخ'),()=>toast('مقدرتش أنسخ، حدد النص يدوي'))}catch(e){toast('مقدرتش أنسخ، حدد النص يدوي')}}
function setHH(){ const h=$('top').getBoundingClientRect().height; document.documentElement.style.setProperty('--hh',Math.round(h)+'px'); }
function go(target){
  $('res').hidden=true;
  const tv=viewOf(target); if(tv&&tv!==VIEW){ VIEW=tv; renderMain(); }
  if(VIEWS.some(x=>x[0]===target)){ window.scrollTo({top:0}); return; }
  if(target.startsWith('o-')){ const id=target.slice(2); OPEN.add(id); if(CAT!=='all'&&OFFERS.find(o=>o.id===id).cat!==CAT) CAT='all'; renderMain(); }
  const el=document.getElementById(target); if(!el) return;
  if(matchMedia('(max-width:1080px)').matches&&DRAWER){ DRAWER=null; renderRail(); }
  el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
  el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1600);
}
/* search */
let RES=[],SEL=-1;
function showRes(){
  const q=$('q').value.trim(); const box=$('res');
  if(!q){box.hidden=true;return}
  RES=search(q); SEL=RES.length?0:-1;
  box.innerHTML=RES.length?RES.map((r,i)=>`<button data-a="res" data-i="${i}" class="${i===SEL?'on':''}"><span class="sec">${esc(r.sec)}</span><b>${esc(r.title)}</b><span class="snip">${esc(String(r.sub).slice(0,120))}</span></button>`).join(''):`<div style="padding:12px 14px;color:var(--muted)">مفيش نتايج لـ "${esc(q)}". جرب كلمة تانية، أو اسأل التيم ليدر.</div>`;
  box.hidden=false;
}
function pickRes(i){ const r=RES[i]; if(!r) return; go(r.go); }
$('q').addEventListener('input',showRes);
$('q').addEventListener('focus',showRes);
$('q').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!RES.length) return; SEL=(SEL+(e.key==='ArrowDown'?1:-1)+RES.length)%RES.length; [...$('res').querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('on',i===SEL)); }
  if(e.key==='Enter'){ e.preventDefault(); pickRes(SEL<0?0:SEL); }
  if(e.key==='Escape'){ $('res').hidden=true; $('q').blur(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='/'&&document.activeElement!==$('q')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); $('q').focus(); $('q').select(); } });
document.addEventListener('change',e=>{ const t=e.target;
  if(t.dataset.a==='ck'){ const k=ST.callType; ST.call[k]=ST.call[k]||{}; ST.call[k][t.dataset.v]=t.checked; saveST(); renderRail(); }
  if(t.dataset.a==='ctype'){ ST.callType=t.value; saveST(); renderRail(); }
});
document.addEventListener('click',e=>{
  if(!e.target.closest('.sbox')) $('res').hidden=true;
  const t=e.target.closest('[data-a]'); if(!t) return; const a=t.dataset.a, v=t.dataset.v;
  if(a==='res') pickRes(+t.dataset.i);
  if(a==='go'){ e.preventDefault(); go(v); }
  if(a==='toggle'){ OPEN.has(v)?OPEN.delete(v):OPEN.add(v); renderMain(); }
  if(a==='cat'){ CAT=v; renderMain(); }
  if(a==='expand'){ OFFERS.forEach(o=>OPEN.add(o.id)); renderMain(); }
  if(a==='collapse'){ OPEN.clear(); renderMain(); }
  if(a==='copy'){ copyText(t.dataset.t); }
  if(a==='pin'){ ST.pins=pinned(v)?ST.pins.filter(x=>x!==v):[...ST.pins,v]; saveST(); renderMain(); renderRail(); toast(pinned(v)?'اتثبت في الجنب':'اتشال التثبيت'); }
  if(a==='sug'){ pickSug(+t.dataset.i); return; }
  if(a==='bq'){ if(DRAWER!=='chat'){DRAWER='chat';} botSend(t.dataset.t); return; }
  if(a==='bclear'){ BOT.msgs=[]; renderRail(); return; }
  if(a==='drawer'){ DRAWER=v||null; renderRail(); if(DRAWER==='chat'){ const l=$('chatlog'); if(l) l.scrollTop=l.scrollHeight; const i=$('cq'); if(i&&!matchMedia('(max-width:1080px)').matches) i.focus(); } if(DRAWER==='call'&&!TI) TI=setInterval(()=>{const el=$('tmr');if(el&&T0)el.textContent=mm((Date.now()-T0)/1000)},1000); }
  if(a==='useflow'){ const k=Object.keys(CALLCK).find(k=>CALLCK[k].f===+v); if(k){ST.callType=k;saveST();} DRAWER='call'; renderRail(); }
  if(a==='tstart'){ T0=Date.now(); ST.call[ST.callType]={}; saveST(); renderRail(); if(!TI) TI=setInterval(()=>{const el=$('tmr');if(el&&T0)el.textContent=mm((Date.now()-T0)/1000)},1000); }
  if(a==='creset'){ ST.call[ST.callType]={}; saveST(); renderRail(); }
  if(a==='addq'){ ST.quote[v]=(ST.quote[v]||0)+1; saveST(); DRAWER='quote'; renderRail(); toast('اتضاف للحاسبة'); }
  if(a==='qp'){ ST.quote[v]=(ST.quote[v]||0)+1; saveST(); renderRail(); }
  if(a==='qm'){ ST.quote[v]=Math.max(0,(ST.quote[v]||0)-1); saveST(); renderRail(); }
  if(a==='qclear'){ ST.quote={}; saveST(); renderRail(); }
  if(a==='qcopy'){ const sel=VARIANTS.filter(x=>ST.quote[x.id]>0); const total=sel.reduce((s,x)=>s+x.p*ST.quote[x.id],0);
    copyText(sel.map(x=>`- ${x.t}${ST.quote[x.id]>1?' × '+ST.quote[x.id]:''}: ${fmt(x.p*ST.quote[x.id])} AED`).join('\n')+`\nالإجمالي: ${fmt(total)} AED\n(أسعار عروض Big Gift Week، والسعر النهائي بعد استشارة الدكتور)`,'اتنسخ الملخص'); }
  if(a==='wgo'){ const node=WIZ[WZ.node]; const [lbl,to]=node.o[+t.dataset.i]; WZ.path.push(lbl); WZ.node=to; renderRail(); }
  if(a==='wreset'){ WZ={node:'start',path:[]}; renderRail(); }
  if(a==='totop'){ window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
});

INDEX.forEach(e=>{ if(!e.n) e.n=norm(e.text+' '+e.title); });
INDEX.push({sec:'أدوات',title:'حاسبة الأسعار',sub:'اجمع أسعار أكتر من عرض واعرف عدد الهدايا',go:'prices',text:'حاسبه اسعار اجمالي كام مجموع هدايا',n:norm('حاسبه حاسبة اسعار اجمالي كام مجموع هدايا')});
UPDATES.forEach(u=>INDEX.push({sec:'التحديثات',title:u[1].slice(0,60),sub:u[0],go:'updates',text:u[1],n:norm(u[1])}));
(function(){ const h=(location.hash||'').slice(1); const v=viewOf(h); if(v) VIEW=v; })();
renderMain(); renderRail(); setHH(); tickBranches(); setInterval(tickBranches,60000);
(function(){ const h=(location.hash||'').slice(1); if(h&&h!==VIEW&&document.getElementById(h)) setTimeout(()=>go(h),50); })();
