<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}/* WhatsApp sender */
.wa-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}

.wa-out textarea{line-height:1.6;resize:vertical;min-height:260px}
.wa-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.wa-seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wa-seg button{border:0;background:transparent;padding:9px 12px;font:inherit;cursor:pointer;color:inherit}
.wa-seg button.on{background:var(--rose);color:#fff}
.wa-lbl{font-weight:700;margin-top:6px}
.wa-cat{display:flex;flex-direction:column;gap:4px}.wa-cat>span{font-size:12px;color:var(--muted)}
.wa-chips{display:flex;flex-wrap:wrap;gap:6px}
.wa-chips button{border:1px solid var(--line);background:var(--paper);color:inherit;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;min-height:36px}
.wa-chips button.on{background:var(--sage-soft);border-color:var(--sage);color:var(--sage);font-weight:700}
.wa-chips button.on::before{content:"✓ "}
.wa-acts{display:flex;flex-wrap:wrap;gap:8px}
.wa-go,.wa-go2{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;min-height:44px}
.wa-go{background:#25d366;color:#08331a}.wa-go2{background:var(--rose);color:#fff}
.wa-box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.wa-box summary{cursor:pointer}
.wa-note{font-size:13px;background:var(--soft);border-radius:8px;padding:8px 10px}
.wa-warn{color:var(--red);font-size:13px;font-weight:600}
.wa-warn[hidden]{display:none}
.wa-kind{align-self:flex-start}.wa-row2{grid-template-columns:1fr 1fr}
.wa-form input[type=date],.wa-form input[type=time]{min-height:42px}
.wa-need{border-color:#c0392b!important;box-shadow:0 0 0 3px rgba(192,57,43,.18)}
.team-q{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px 11px;width:100%;margin:4px 0}
.wa-sel{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
</style></head><body>
<title>Tres Jolie Agent Handbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F5F6F8; --paper:#FFFFFF; --soft:#EFF1F4; --ink:#18222E; --muted:#5B6674; --line:#DADFE6;
  --rose:#A63D63; --rose-soft:#F8E6ED; --sage:#2F7565; --sage-soft:#E0F0EB; --amber:#A8660C; --amber-soft:#FCEFD8; --red:#B83A2E; --red-soft:#FBE3E0; --blue:#2C6395; --blue-soft:#E2EDF7;
  --head:#1D2B3A; --head2:#263849; --head-ink:#EEF2F6; --shadow:0 12px 32px rgba(20,30,45,.18);
  --hh:112px;
  --f:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif; --d:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif; --m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#10161D; --paper:#18212B; --soft:#1F2A36; --ink:#E6EBF0; --muted:#9AA6B3; --line:#2C3947;
  --rose:#E07BA0; --rose-soft:#3A2230; --sage:#5DC0A6; --sage-soft:#17332C; --amber:#E9AE52; --amber-soft:#3A2C15; --red:#EE7F73; --red-soft:#3C201D; --blue:#7DB3E6; --blue-soft:#1A2B3C; --head:#0B1117; --head2:#141E28; --head-ink:#E6EBF0; --shadow:0 12px 32px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#10161D; --paper:#18212B; --soft:#1F2A36; --ink:#E6EBF0; --muted:#9AA6B3; --line:#2C3947;
  --rose:#E07BA0; --rose-soft:#3A2230; --sage:#5DC0A6; --sage-soft:#17332C; --amber:#E9AE52; --amber-soft:#3A2C15; --red:#EE7F73; --red-soft:#3C201D; --blue:#7DB3E6; --blue-soft:#1A2B3C; --head:#0B1117; --head2:#141E28; --head-ink:#E6EBF0; --shadow:0 12px 32px rgba(0,0,0,.5)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--f)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate}
.m{font-family:var(--m);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--d);text-wrap:balance;line-height:1.35}

/* ===== sticky header: search + section tabs (always visible) ===== */
.top{background:var(--head);color:var(--head-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.bar{max-width:1320px;margin:0 auto;padding:10px 16px;display:grid;gap:10px;grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
@media (max-width:760px){.bar{grid-template-columns:minmax(0,1fr) auto}.brand{display:none!important}}
.brand{display:grid;line-height:1.25}
.brand b{font-family:var(--d);font-size:17px}
.brand span{font-size:12px;opacity:.7}
.sbox{position:relative}
.sbox input{width:100%;border:0;border-radius:10px;padding:10px 42px 10px 44px;background:rgba(255,255,255,.1);color:var(--head-ink);font-size:16px}
.sbox input::placeholder{color:rgba(238,242,246,.6)}
.sbox svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.7}
.sbox kbd{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:var(--m);font-size:12px;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:0 6px;opacity:.7}
.results{position:absolute;inset-inline:0;top:calc(100% + 6px);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow-y:auto;z-index:40}
.results button{display:grid;gap:1px;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px}
.results button:hover,.results button.on{background:var(--soft)}
.results .sec{font-size:11.5px;color:var(--rose);font-weight:700}
.results .snip{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:6px}
.tbtn{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:var(--head-ink);border-radius:9px;padding:8px 12px;font-size:14px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tbtn:hover{background:rgba(255,255,255,.14)}
.tbtn.on{background:var(--rose);border-color:var(--rose);color:#fff}
@media (max-width:760px){.tbtn .t{display:none}}
.tabs{background:var(--head2);border-top:1px solid rgba(255,255,255,.08)}
.tabs-in{max-width:1320px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-inline:12px}
.tabs-in::-webkit-scrollbar{display:none}
@media (min-width:760px){.tabs-in{flex-wrap:wrap;overflow-x:visible;row-gap:0}}
@media (max-width:759px){.tabs-in{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)}}
.tabs a{color:var(--head-ink);opacity:.72;text-decoration:none;padding:8px 12px 9px;white-space:nowrap;font-size:14px;border-bottom:3px solid transparent}
.tabs a:hover{opacity:1}
.tabs a.on{opacity:1;border-bottom-color:var(--rose);font-weight:700}
.tabs .cnt{font-family:var(--m);font-size:11.5px;opacity:.7;margin-inline-start:4px}

/* ===== layout ===== */
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 60px;padding-inline:16px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px;align-items:start}
.wrap.drawer-open{grid-template-columns:minmax(0,1fr) 380px}
@media (max-width:1080px){.wrap,.wrap.drawer-open{grid-template-columns:1fr}}
main{display:grid;gap:36px;min-width:0;order:1}
aside.rail{order:2;position:sticky;top:calc(var(--hh) + 12px + env(safe-area-inset-top,0px));max-height:calc(100vh - var(--hh) - 24px);overflow-y:auto;display:grid;gap:12px;align-content:start}
@media (max-width:1080px){aside.rail{position:fixed;inset:auto 0 0 0;top:auto;max-height:78vh;z-index:35;background:var(--bg);border-top:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px 14px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  aside.rail.closed{display:none}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.panel h3{margin:0;font-size:14.5px}
.pins a{display:flex;justify-content:space-between;gap:8px;color:var(--ink);text-decoration:none;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}

.pins .p{font-family:var(--m);font-size:12.5px;color:var(--muted);white-space:nowrap}
section{display:grid;gap:14px;scroll-margin-top:calc(var(--hh) + 16px)}
.sh{display:grid;gap:4px}
.sh h2{margin:0;font-size:22px}
.sh p{margin:0;color:var(--muted);max-width:75ch}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--rose)}

/* quick answers */
.quick{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.qa-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;text-align:start;align-content:start}
.qa-card:hover{border-color:var(--rose)}
.qa-card .k{font-size:12px;color:var(--muted)}
.qa-card b{font-family:var(--d);font-size:15px}
.qa-card span{font-size:13.5px}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

.ib.say{padding:2px 7px;line-height:1.2;vertical-align:middle}
.tagrow{display:flex;flex-wrap:wrap;gap:4px}.c-tag{background:var(--blue-soft);color:var(--blue)}.c-stage{background:var(--sage-soft);color:var(--sage);white-space:nowrap}
.odt td{vertical-align:top}.tagf{width:100%;max-width:340px;margin:0 0 8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}
.dcard{display:grid;gap:6px;margin-top:8px}.dcard .dr{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.dcard .dr>span{color:var(--muted);font-size:13px;min-width:74px}.dcard em{font-style:normal;font-weight:600;font-size:14px;font-family:inherit}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
.c-ok{background:var(--sage-soft);color:var(--sage)}
.c-warn{background:var(--amber-soft);color:var(--amber)}
.c-no{background:var(--red-soft);color:var(--red)}
.c-cat{background:var(--soft);color:var(--muted)}

.rules{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.rule{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.rule b{font-size:14.5px}
.rule span{font-size:13.5px;color:var(--muted)}
.rule.no b{color:var(--red)}
.rule.yes b{color:var(--sage)}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:4px 12px;font-size:13.5px}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.offers{display:grid;gap:12px}
.offer{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;scroll-margin-top:calc(var(--hh) + 16px)}
.flash{box-shadow:0 0 0 3px var(--rose)!important}
.ohead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 16px;align-items:start}
.ohead .tt{display:grid;gap:2px;cursor:pointer;text-align:start;background:none;border:0;padding:0}
.ohead h3{margin:0;font-size:17px}
.ohead .en{font-size:12.5px;color:var(--muted);text-align:right}
.ohead .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.price{text-align:end;display:grid;gap:4px;justify-items:end}
.price .v{font-family:var(--m);font-size:20px;font-weight:600;white-space:nowrap}
.price .v small{font-size:12px;color:var(--muted);font-weight:500}
.price .n{font-size:12px;color:var(--muted);max-width:210px}
.price .acts{display:flex;gap:4px}
.ib{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:2px 8px;font-size:12.5px;display:inline-flex;gap:4px;align-items:center}
.ib:hover{border-color:var(--rose)}
.ib.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.obody{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:14px}
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.say{background:var(--sage-soft);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.say p{margin:0;font-size:15.5px}
.say .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.copy{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:1px 9px;font-size:12px}

.src{font-size:12px;color:var(--muted)}

.tw{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--soft);color:var(--muted);font-weight:500;text-align:start;padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}

.flows{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.flow{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;align-content:start;scroll-margin-top:calc(var(--hh) + 16px)}
.flow h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.flow ol{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.flow li::marker{font-family:var(--m);color:var(--rose)}
.line{display:block;background:var(--soft);border-radius:6px;padding:2px 8px;margin-top:3px;font-size:14px}

.objs{display:grid;gap:10px}
.obj{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:8px;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);align-items:start;scroll-margin-top:calc(var(--hh) + 16px)}

.obj.hot{border-color:var(--amber);box-shadow:inset -4px 0 0 var(--amber)}
.obj .cq{font-family:var(--d);font-size:15.5px;display:grid;gap:4px;justify-items:start}
.obj .cq small{font-family:var(--f);font-size:12px;color:var(--muted)}
.obj .ans{display:grid;gap:6px}
.obj .avoid{font-size:13.5px;color:var(--red)}
ol.steps{margin:0;padding-inline-start:20px;display:grid;gap:3px;font-size:14px}

.gl{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.g{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}

.log{display:grid;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 16px}

.prod{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;scroll-margin-top:calc(var(--hh) + 16px)}
.phead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;background:var(--soft);border-bottom:1px solid var(--line)}

.pp{margin:2px 0 0}
ul.tick{margin:2px 0 0;padding-inline-start:18px;display:grid;gap:2px}

.phr{display:grid;gap:8px}

.cm{border-radius:12px;padding:9px 12px;font-size:14.5px;display:grid;gap:6px;max-width:100%}
.cm.u{justify-self:end;background:var(--rose);color:#fff;border-end-end-radius:3px;max-width:85%}
.cm.b{justify-self:start;background:var(--soft);border-end-start-radius:3px}
.cm .say{background:var(--paper)}

.chips2{display:flex;gap:6px;flex-wrap:wrap}

.chips2 button:hover{border-color:var(--rose)}
.cin{display:flex;gap:6px}

function parseHour(v){ v=String(v||'').trim().toLowerCase().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)); if(!v) return null;
  const m=v.match(/(\d{1,2})(?:[:.](\d{2}))?(?::\d{2})?\s*(am|pm|ص|م|الصبح|صباحا|صباحاً|الضهر|ظهرا|ظهراً|العصر|عصرا|المغرب|بالليل|مساء|مساءا|مساءً)?/); if(!m) return null;
  let h=+m[1]; const mm=m[2]?+m[2]/60:0; const ap=m[3]||''; if(/pm|م|الضهر|ظهر|العصر|عصر|المغرب|بالليل|مساء/.test(ap)&&h<12) h+=12; if(/am|ص|الصبح|صباح/.test(ap)&&h===12) h=0; return h+mm; }
function parseDate(v){ v=String(v||'').trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)); let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); } return ''; }
const yes=v=>/^(✓|✔|x|نعم|اه|ايوه|أيوه|yes|y|1|true|موجود|موجوده|موجودة)$/i.test(String(v||'').trim());
function sheetJsonp(u){ return new Promise((ok,bad)=>{ const cb='__gv'+Math.random().toString(36).slice(2); const sc=document.createElement('script');
  const t=setTimeout(()=>{ cleanup(); bad(new Error('timeout')); },15000); function cleanup(){ clearTimeout(t); delete window[cb]; sc.remove(); }
  window[cb]=res=>{ cleanup(); try{ const tb=res.table; const lab=tb.cols.map(c=>String(c.label||'')); const rows=lab.some(Boolean)?[lab]:[]; /* no labels: the sheet's header is the first data row */ tb.rows.forEach(r=>rows.push((r.c||[]).map(c=>c==null?'':String(c.f!=null?c.f:(c.v==null?'':c.v)).trim()))); ok(rows); }catch(e){ bad(e); } };
  sc.onerror=()=>{ cleanup(); bad(new Error('jsonp')); }; sc.src=u.replace('tqx=out:csv','tqx=out:json;responseHandler:'+cb)+'&t='+Date.now(); document.head.appendChild(sc); }); }
const sheetGet=async u=>{ if(!u) return null;
  try{ const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error(r.status); return parseCSV(await r.text()); }
  catch(e){ if(/gviz\/tq/.test(u)) return sheetJsonp(u); throw e; } };
function stOf(v){ v=String(v||'').trim(); if(!v) return ''; if(/مش متاح|غير متاح|not avail|^no$/i.test(v)) return 'no'; if(/تأكيد|تاكيد|verify|confirm(ation)? needed|needs/i.test(v)) return 'warn'; if(/مؤكد|confirmed|^ok$/i.test(v)) return 'ok'; return ''; }
function catOf(v){ v=String(v||'').trim(); if(!v) return ''; const k=Object.keys(CATS).find(k=>k===v.toLowerCase()||CATS[k]===v); if(k) return k;
  if(/بوتوكس|botox/i.test(v)) return 'botox'; if(/فيلر|filler/i.test(v)) return 'filler'; if(/نضار|كولاجين|skin|glow/i.test(v)) return 'skin'; if(/ليزر|laser/i.test(v)) return 'laser'; if(/وزن|تخسيس|weight/i.test(v)) return 'weight'; if(/نحت|دهون|body|fat/i.test(v)) return 'body'; return 'body'; }
/* Offers tab columns: A id | B name AR | C name EN | D category | E price | F price details AR | G price details EN | H status |
   I say AR | J say EN | K what AR | L what EN | M agent note AR | N agent note EN | O calculator AR "label=price; ..." | P calculator labels EN "label; ..." | Q hidden */
function applyOfferRows(rows){ const en=LANG==='en'; const pick=(a,b)=>(en&&b)?b:a;
  rows.slice(1).filter(r=>r[0]&&!/كود العرض|offer code/i.test(r[0])).forEach(r=>{ const id=r[0].trim(); let o=OFFERS.find(x=>x.id===id);
    if(/^(نعم|yes|y|✓|1|true|مخفي|hide)$/i.test((r[16]||'').trim())){ if(o) OFFERS.splice(OFFERS.indexOf(o),1); return; }
    if(!o){ o={id,cat:'body',ar:'',en:'',price:'—',pn:'',st:'warn',slide:'',what:'',who:'',say:'',qa:[],caution:''}; OFFERS.push(o); }
    const set=(k,v)=>{ if(v!=null&&String(v).trim()!=='') o[k]=String(v).trim(); };
    set('ar',pick(r[1],r[2])); set('en',r[2]); const c=catOf(r[3]); if(c) o.cat=c; set('price',r[4]); set('pn',pick(r[5],r[6])); const st=stOf(r[7]); if(st) o.st=st;
    set('say',pick(r[8],r[9])); set('what',pick(r[10],r[11])); set('caution',pick(r[12],r[13]));
    if((r[14]||'').trim()&&typeof VARIANTS!=='undefined'){ const labs=(r[15]||'').split(/[;؛]/).map(x=>x.trim());
      const old=VARIANTS.filter(v=>v.o===id); const lab=v=>{ const i=v.t.indexOf(': '); return i>=0?v.t.slice(i+2):v.t; };
      const parts=r[14].split(/[;؛]/).map(x=>x.trim()).filter(Boolean).map(x=>{ const m=x.split('='); return {l:m[0].trim(),p:parseFloat(String(m[1]||'').replace(/[^\d.]/g,''))}; }).filter(x=>x.p>0);
      const same=parts.length===old.length&&parts.every((x,i)=>x.p===old[i].p);
      if(parts.length&&!same){ const vs=parts.map((x,i)=>{ const L=(en&&labs[i])?labs[i]:x.l; const base=old[i]||{id:id+'_s'+i,o:id};
          return {...base,p:x.p,t:(old[i]&&lab(old[i])===(en&&labs[i]?labs[i]:x.l))?old[i].t:((o.ar||'').includes(L)?o.ar:(o.ar||id)+': '+L)}; });
        const at=VARIANTS.indexOf(old[0]); for(let i=VARIANTS.length-1;i>=0;i--) if(VARIANTS[i].o===id) VARIANTS.splice(i,1); VARIANTS.splice(at>=0?at:VARIANTS.length,0,...vs); } }
  }); }
/* Regular prices tab: A service AR | B service EN | C price | D details AR | E details EN | F hidden */
function applyRegularRows(rows){ const en=LANG==='en'; const list=rows.slice(1).filter(r=>(r[0]||r[1])&&!/^(نعم|yes|✓|مخفي|hide)$/i.test((r[5]||'').trim()))
    .map((r,i)=>({id:'r'+i,ar:(en&&r[1])?r[1]:r[0],price:r[2]||'—',pn:(en&&r[4])?r[4]:(r[3]||''),src:'Google Sheet'}));
  if(list.length){ REGULAR.length=0; REGULAR.push(...list); } }
async function loadOfferSheets(){ if(!SHEETS.offers&&!SHEETS.regular) return false;
  try{ const [of,rg]=await Promise.all([sheetGet(SHEETS.offers),sheetGet(SHEETS.regular)]); if(of) applyOfferRows(of); if(rg) applyRegularRows(rg); return true; }
  catch(e){ console.warn('offer sheet failed',e); return false; } }

  areas:['الجبهة','خطوط العبوس بين الحواجب','التجاعيد حوالين العين (خطوط الضحك)','رفع الحواجب'],
  compare:[['نابوتا (Nabota)','كوري جنوبي','حاصل على اعتمادات جودة دولية. نقي، ونتيجته بتظهر بسرعة، واختيار اقتصادي بجودة ممتازة وثبات قوي. مناسب جداً للعملاء الجداد أو اللي عايز نتيجة ممتازة بسعر منافس.'],['ديسبورت (Dysport)','بريطاني','جزيئاته أصغر وأخف، فبينتشر على مساحة أوسع (Spreadability). مناسب للمناطق الكبيرة زي الجبهة العريضة، ومعروف إنه بيدي شكل طبيعي جداً.']],

  phrases:['البوتوكس مش مجرد تجميل، ده استثمار في نضارة وشك وبيحميه إن التجاعيد تعمق مع الوقت. وتكلفته النهارده أقل بكتير من علاج تجاعيد عميقة بعدين.','بنستخدم أنواع عالمية معتمدة، نابوتا وديسبورت، وتحت إشراف دكتور متخصص، عشان توصلي لنتيجة طبيعية من غير شكل "متجمد".','اطمني، هدفنا إننا نخفي علامات التعب والإرهاق، وتعابير وشك تفضل طبيعية وحيوية.'],
  objs:[['أخاف لما مفعول البوتوكس يروح التجاعيد ترجع أسوأ من قبل!','ده اعتقاد غلط ومنتشر. بالعكس، طول فترة المفعول العضلات بتكون مرتاحة ومش بتعمل الحركة اللي بتعمّق التجاعيد. ولما المفعول يروح، وشك بيرجع زي ما كان، مش أسوأ.'],['وش الفرق الحقيقي بين نابوتا وديسبورت؟ أختار أيهم؟','الاتنين ممتازين ومعتمدين عالمياً. نابوتا مميز بنقائه وسعره المناسب، وديسبورت مميز إنه بينتشر على مساحة أوسع فبيناسب المناطق الكبيرة. والدكتور هيقيّم حركة عضلات وشك في الاستشارة وينصحك بالأنسب.']],
  cautions:['قول المدد بكلمة "عادةً" وإنها بتختلف من شخص للتاني. متقولهاش كوعد.','الدليل كان مكتوب فيه "يضمن لك نتيجة طبيعية". متقولش "يضمن"، قول "عشان توصلي لنتيجة طبيعية".','العميلة الحامل بيتعملها Hold ونكلمها بعد الولادة. وأي سؤال عن رضاعة أو أدوية أو أمراض بيتحوّل للدكتور.']},

  facts:[['الميزو للوش كله بس؟','لأ، مش لازم الوش كله. بيتحدد حسب المشكلة والمنطقة المطلوبة، والدكتور هو اللي يحدد.']],

  objs:[['أبي الميزو لمنطقة وحدة بس، ينفع؟','أيوه ينفع، الميزو مش لازم للوش كله. الدكتور هيحدد المنطقة المناسبة لحالتك في الاستشارة.'],['وش الفرق بينه وبين البوتوكس العادي؟','البوتوكس العادي بيتحقن في العضلة نفسها عشان يرخّيها، أما الميزو فحقن سطحية بتحسّن ملمس الجلد والمسام والخطوط الرفيعة.']],

 {id:'sculptra',name:'سكلبترا',en:'Sculptra',offers:['sculptra'],

  facts:[['عدد الجلسات؟','العرض على حقنة واحدة بـ 1,500 ومعاه هدية. متقولش للعميل عدد جلسات، لأنه هيطلب العرض على كذا جلسة. الدكتور هو اللي بيحدد.'],['النتيجة بتبان إمتى؟','بالتدريج، من أول شهر لتالت شهر.'],['الجلسة بتتعمل إزاي؟','الدكتور بيحقن المادة بدقة، وبعدها فيه تدليك خاص بيشرحه الدكتور (قاعدة 5-5-5: تدليك 5 مرات في اليوم لمدة 5 أيام).']],
  phrases:['السكلبترا مش مجرد ملء مؤقت. ده استثمار طويل المدى بيدرّب بشرتك تعمل الكولاجين بنفسها.','الجمال الحقيقي محتاج وقت عشان يتبني بثبات. مع السكلبترا النتيجة بتظهر بالتدريج وبشكل طبيعي، والناس هتلاحظ إن شكلك منوّر.'],
  objs:[['ليش النتيجة ما تبان على طول مثل الفيلر العادي؟','عشان السكلبترا بيشتغل كأنه مصنع جوه البشرة، بيحفّز خلاياك تعمل الكولاجين الطبيعي. والبناء التدريجي ده هو اللي بيدي نتيجة طبيعية وثابتة أكتر. والدكتور هيوضحلك الوقت المتوقع لحالتك.']],
  cautions:['"لحد سنتين أو أكتر" قولها "ممكن تدوم لحد سنتين، وبتختلف من شخص للتاني". متقولهاش كوعد.','قاعدة التدليك 5-5-5 معلومة ليك عشان تفهم. التعليمات اللي بعد الجلسة الدكتور هو اللي بيشرحها للعميل.','الدليل كان فيه "محدش هيلاحظ إنك عملتي إجراء تجميلي". غيرناها لأنها وعد مش مضمون.']},
 {id:'endolaser',name:'إندوليزر',en:'Endolaser',offers:['endolaser'],src:'kb',
  what:'ليزر بطولين موجيين بيشد الجلد ويعيد تشكيل الأنسجة، من غير جراحة.',
  areas:['الغبغب (الدبل تشن)','الوش والرقبة','البطن','الدراعات','الفخاد'],

  facts:[['الجلسة بتاخد قد إيه؟','منطقة صغيرة في الوش: حوالي 30 لـ 45 دقيقة. الوش كامل: غالباً 45 لـ 90 دقيقة. منطقة أكبر زي البطن أو الفخاد: من ساعة لساعتين أو أكتر.'],['النتيجة بتبان إمتى؟','على مراحل. الأوضح بعد شهر لـ 3 شهور، وممكن تفضل تتحسن لحد 6 شهور.']],
  phrases:['الإندوليزر بيشد الجلد من غير جراحة، والنتيجة بتتحسن بالتدريج لأنه بيحفّز الكولاجين.'],
  objs:[['سويت الجلسة وما شفت فرق!','طبيعي في الأول يكون فيه تورم بسيط بيخبي النتيجة. الشكل بيتحسن أوضح بعد أسبوع لاتنين، والنتيجة الحقيقية بتبان بعد شهر لـ 3 شهور. ولو حابة، أحجزلك متابعة مجانية مع الدكتور يطمّنك.']],

 {id:'laser',name:'ليزر إزالة الشعر',en:'Candela GentleMax Pro Plus',offers:['laser1','laser2'],src:'kb',
  what:'جهاز Candela GentleMax Pro Plus، معروف باسم "الجنتل الأبيض"، وهو النسخة الأحدث بعد النسخة الرمادية القديمة. مش بيلمس الجلد: رأس الجهاز بيبقى على مسافة محددة، والليزر ورذاذ التبريد (DCD) بيوصلوا لبصيلة الشعر عبر الهوا.',
  areas:['الجسم كامل، مع الظهر والبطن أو من غيرهم','مناطق منفصلة'],
  features:['بيشيل الشعر الوبري (الخفيف)، وأحسن من الأجيال اللي قبله في ده.','نظافة أعلى: عدم الملامسة بيقلل جداً انتقال البكتيريا والفطريات من حالة للتانية.','راحة أكتر: رذاذ التبريد بيحمي البشرة من الحرارة قبل وبعد النبضة.','الأخصائية بتشوف المنطقة كلها بوضوح، فتوزيع النبضات بيبقى أدق.'],
  facts:[['كام جلسة؟','عادةً من 6 لـ 8 جلسات لأغلب الحالات، حسب لون البشرة والشعر.'],['بين الجلسة والتانية قد إيه؟','من 4 لـ 6 أسابيع.'],['الجلسة بتاخد قد إيه؟','الجسم كامل (مع أو من غير الظهر والبطن): حوالي ساعة. منطقة واحدة: حوالي نص ساعة.'],['الجهاز بيلمس الجلد؟','لأ، الجهاز مش بيلمس الجلد.'],['العميلة بتفكر في إيه قبل ما تحجز ليزر؟','3 حاجات: هل هتاخد نتيجة حقيقية من غير ما تضيّع وقتها وفلوسها، هل الجلسة بتوجع (ده أكبر قلق خصوصاً للعميلة الجديدة)، وهل آمن على بشرتها من الحروق أو التصبغات. طمّنها في التلاتة دول الأول.']],
  phrases:['جهاز Candela GentleMax Pro Plus مش بيلمس الجلد، ومعاه رذاذ تبريد بيحمي البشرة، فالجلسة أنضف وأريح.','الجهاز بيشيل كمان الشعر الخفيف (الوبري).','اختم المكالمة دايماً بحجز الاستشارة المجانية: تحبي نحجز لحضرتك الاستشارة المجانية مع الدكتورة؟'],
  objs:[['ليه أحجز عندكم وفيه أماكن تانية؟','أهلاً بحضرتك يا فندم. احنا بنشتغل بجهاز كانديلا جنتل ماكس برو بلس، النسخة البيضاء الأحدث. مش بيلمس الجلد، ومعاه رذاذ تبريد بيحمي البشرة، وبيشيل كمان الشعر الخفيف. تحبي نحجز لحضرتك الاستشارة المجانية؟'],['خايفة من الألم.','مفهوم جداً قلق حضرتك. الجهاز معاه رذاذ تبريد بيبرّد الجلد مع كل نبضة، فالجلسة بتبقى أريح بكتير، والأخصائية بتقيّم بشرتك قبل ما تبدأ. تحبي نحجز لحضرتك الاستشارة المجانية وتسألي الدكتورة على كل اللي في بالك؟'],['الباكج 6 جلسات، تكفي؟','أغلب الحالات بتحتاج من 6 لـ 8 جلسات، وده بيختلف حسب لون البشرة والشعر. الدكتور هيقيّم حالتك ويقولك المتوقع.'],['الجهاز يحرق؟','الجهاز معاه رذاذ تبريد بيحمي البشرة قبل وبعد النبضة، والأخصائية بتقيّم بشرتك قبل ما تبدأ. ولو عندك أي سؤال طبي، الدكتور هيجاوبك في الاستشارة.']],
  cautions:['الباكج 6 جلسات، وأغلب الحالات بتحتاج من 6 لـ 8. وضّح ده بأمانة، ومتقولش إن 6 كفاية أكيد.','الملف كان فيه "يمنع تماماً" و"بدون حروق". متقولش وعود زي دي، قول إن التبريد بيحمي البشرة.','ملف تدريب المبيعات (19 أكتوبر) فيه جمل لسه مستنية تأكيد الكلاينت أو الدكتورة: "نتائج مضمونة"، "أقوى 3 مرات"، "نتايج أسرع وجلسات أقل"، "بيفتّح التصبغات ويشد الجلد من أول جلسة"، "بدون ألم تقريباً"، و"تبريد دايم طول الجلسة". متقولهاش لحد ما تتأكد.']},

function norm(s){return String(s||'').toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))}
let INDEX=[];
function buildIndex(){
  INDEX=[];
  OFFERS.forEach(o=>INDEX.push({sec:'العروض · '+CATS[o.cat],title:o.ar,sub:o.price+' AED · '+o.pn,go:'o-'+o.id,text:[o.ar,o.en,o.what,o.who,o.say,o.caution,o.qa.map(x=>x.join(' ')).join(' '),CATS[o.cat]].join(' ')}));
  OBJ.forEach((x,i)=>INDEX.push({sec:x[4]?'الاعتراضات · الأكتر تكراراً':'الاعتراضات',title:x[0],sub:x[2],go:'obj-'+i,text:x.slice(0,4).join(' ')+' '+(x[5]||[]).join(' ')}));
  FLOWS.forEach((f,i)=>INDEX.push({sec:'خطوات المكالمة',title:f.t,sub:f.steps[0][0],go:'flow-'+i,text:f.t+' '+f.steps.map(s=>s.join(' ')).join(' ')}));
  STAGES.forEach(st=>INDEX.push({sec:'أودوو',title:'Stage: '+st.n,sub:st.tags.join(', '),go:'stages',text:[st.n,st.ar,st.tags.join(' '),'odoo stage مرحله اودوو'].join(' ')}));
  TAGS.forEach(t=>INDEX.push({sec:'أودوو',title:'Tag: '+t.n,sub:t.ar,go:'tags',text:[t.n,t.ar,t.en,'odoo tag تاج اودوو'].join(' ')}));
  DISP.forEach(d=>INDEX.push({sec:'أودوو',title:d.s,sub:[d.st,d.tg,d.act].filter(Boolean).join(' · '),go:'disp',text:[d.s,d.st,d.tg,d.act,d.note,'odoo اودوو'].join(' ')}));
  GULF.forEach(g=>INDEX.push({sec:'قاموس الخليجي',title:g[0],sub:'= '+g[1],go:'gulf',text:g.join(' ')}));
  TERMS.forEach(t=>INDEX.push({sec:'المصطلحات',title:t[0],sub:t[2],go:'terms',text:t.join(' ')}));
  REGULAR.forEach(r=>INDEX.push({sec:'أسعار عادية (مش عروض)',title:r.ar,sub:`${r.price} درهم${r.pn?' · '+r.pn:''} · مش عرض، من غير هدية`,go:'regular',text:[r.ar,r.pn,r.price,'سعر عادي'].join(' ')}));
  RULES.forEach(r=>INDEX.push({sec:'قواعد الكلام عن الأسعار',title:r[1],sub:r[2],go:'rules',text:r.join(' ')}));
  CENTER.forEach(c=>INDEX.push({sec:'معلومات المركز',title:c[0],sub:c[1],go:'center',text:c.join(' ')}));
  INDEX.forEach(e=>e.n=norm(e.text+' '+e.title));
}
function search(q){
  let terms=norm(q).split(/\s+/).filter(Boolean); if(!terms.length) return [];
  terms=terms.map(t=>{const s=Object.keys(SYN).find(k=>norm(k)===t||t.startsWith(norm(k))); const alts=s?[t,...norm(SYN[s]).split(' ')]:[t]; if(t.length>=3&&!INDEX.some(e=>e.n.includes(t))) fuzzy(t).forEach(w=>alts.push(w)); return alts});
  return INDEX.map(e=>{let sc=0; for(const alts of terms){ const hit=alts.some(a=>e.n.includes(a)); if(!hit) return null; if(alts.some(a=>norm(e.title).includes(a))) sc+=3; else sc+=1; } return {e,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,12).map(x=>x.e);
}

  DOC_NAMES.forEach(d=>add(en?d[1]+' ('+d[3]+')':d[0]+' ('+d[2]+')'));

function cmpMail(){ const me=teamBy(meGet()); if(!me){ toast(CMU.needMe); const s=$('cmpMe'); if(s) s.focus(); return null; }
  if(!CMP.what.trim()){ toast(CMU.needWhat); const s=$('cmp_what'); if(s) s.focus(); return null; }
  const L=(k,v)=>v&&String(v).trim()?'\n'+k+': '+String(v).trim():'';
  const s=(CMP.urgent?'URGENT ':'')+'Customer complaint: '+CMP_EN[CMP.type]+(CMP.name.trim()?' | '+CMP.name.trim():'')+(CMP.branch?' | '+CMP.branch:'');

  if(e.target.id==='cmpMe'){ if(e.target.value===TEAM_ADD){ const t=teamPrompt(false); meSet(t?t.id:meGet()); } else meSet(e.target.value); renderMain(); } });
document.addEventListener('click',e=>{ const t=e.target.closest('[data-a]'); if(!t) return; const a=t.dataset.a; if(!a.startsWith('cm')) return; e.preventDefault();
  if(a==='cmt'){ CMP.type=t.dataset.v; renderMain(); return; }
  if(a==='cmw'){ const v=t.dataset.v; CMP.wants=CMP.wants.includes(v)?CMP.wants.filter(x=>x!==v):[...CMP.wants,v]; renderMain(); return; }

let VIEW='home';
function viewOf(t){
  for(const [v,,secs] of VIEWS){ if(v===t||secs.includes(t)) return v; }
  if(t==='stages'||t==='tags') return viewOf('disp');
  if(/^o-/.test(t)||t==='regular') return 'offers'; if(/^p-/.test(t)) return 'services'; if(/^(obj|flow)-/.test(t)) return 'calls'; if(/^br-/.test(t)||t==='doctors') return 'branches';
  return null;
}
function uaeParts(){ const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dubai',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()); const g=t=>(f.find(x=>x.type===t)||{}).value; return {wd:g('weekday'),h:+g('hour'),m:+g('minute')}; }
function tzDiff(){ try{ const d=new Date(); const o=z=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:z,hour:'2-digit',hourCycle:'h23',day:'2-digit'}).formatToParts(d);return (+p.find(x=>x.type==='day').value)*24+(+p.find(x=>x.type==='hour').value)}; return o('Asia/Dubai')-o('Africa/Cairo'); }catch(e){return 1} }
const hh0=h=>h<12?h+' الصبح':h===12?'12 الضهر':h<15?(h-12)+' الضهر':h<18?(h-12)+' العصر':(h-12)+' بالليل';
const hh=h=>{ const H=Math.floor(h), M=Math.round((h-H)*60); const b=hh0(H); return M?b.replace(/^\d+/,x=>x+':'+String(M).padStart(2,'0')):b; };
function branchStatus(b){ const t=uaeParts(); const mins=t.h*60+t.m;
  if(t.wd==='Fri') return {open:false,txt:'مقفول النهارده (الجمعة) · بيفتح السبت '+hh(b.open)};
  if(mins>=b.open*60&&mins<b.close*60) return {open:true,txt:'مفتوح دلوقتي · بيقفل '+hh(b.close)};
  if(mins<b.open*60) return {open:false,txt:'مقفول دلوقتي · بيفتح النهارده '+hh(b.open)};
  return {open:false,txt:'مقفول دلوقتي · بيفتح '+(t.wd==='Thu'?'السبت ':'بكرة ')+hh(b.open)}; }
function tickBranches(){ document.querySelectorAll('[data-dstat]').forEach(el=>{ const d=DOCTORS[+el.dataset.dstat]; const st=docStatus(d); el.className='bstat '+(st.on?'on':'off'); el.textContent=st.txt; }); document.querySelectorAll('[data-bstat]').forEach(el=>{ const b=BRANCHES.find(x=>x.id===el.dataset.bstat); const st=branchStatus(b); el.className='bstat '+(st.open?'on':'off'); el.textContent=st.txt; }); const c=document.getElementById('uaeclock'); if(c){ const t=uaeParts(); c.textContent=String(t.h).padStart(2,'0')+':'+String(t.m).padStart(2,'0'); } }
function uaeDate(off){ const d=new Date(Date.now()+(off||0)*86400000); const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dubai',year:'numeric',month:'2-digit',day:'2-digit'}).format(d); return p; }
function weekDates(){ const t=uaeParts(); const idx=WEEK.findIndex(w=>w[0]===t.wd); return WEEK.map(([k,a],i)=>({k,a,date:uaeDate(i-idx)})); }
function docDay(d,date,k){ const e=EXC.find(x=>x.doc===d.name&&x.date===date);
  if(e) return e.on?{on:true,from:e.from??d.from,to:e.to??d.to,note:e.note}:{on:false,note:e.note,exc:true};
  const on=d.days.includes(k)&&(!d.start||date>=d.start)&&(!d.end||date<=d.end); return {on,from:d.from,to:d.to}; }
function docStatus(d){ const t=uaeParts(); const mins=t.h*60+t.m; const dd=docDay(d,uaeDate(0),t.wd);
  if(!dd.on) return {on:false,txt:'مش متاح النهارده'};
  if(mins<dd.from*60) return {on:false,txt:'متاح النهارده من '+hh(dd.from)};
  if(mins<dd.to*60) return {on:true,txt:'متاح دلوقتي لحد '+hh(dd.to)};
  return {on:false,txt:'المواعيد خلصت النهارده'}; }
function docStatus_unused(d){ const t=uaeParts(); const mins=t.h*60+t.m;

  return {on:false,txt:'خلصت النهارده'}; }

function syncDoctors(){ for(let i=RULES.length-1;i>=0;i--) if(RULES[i][3]==='doc') RULES.splice(i,1); RULES.push(...docRules());
  for(let i=CENTER.length-1;i>=0;i--) if(CENTER[i][3]==='doc') CENTER.splice(i,1);
  CENTER.splice(Math.min(3,CENTER.length),0,['الدكاترة',DOCTORS.map(d=>d.name+' ('+d.spec+'، '+BRANCHES.find(x=>x.id===d.br).city+'): '+daysTxt(d)+'، '+hh(d.from)+' – '+hh(d.to)).join(' · ')+'. الجدول كامل في صفحة الفروع والمواعيد.','ok','doc']);
  const old=UPDATES.filter(u=>u[2]!=='sheet'); UPDATES.length=0; UPDATES.push(...SHEET_UPDATES.map(u=>[u[0],u[1],'sheet']),...old); }
function lastSlot(d){ const m=d.to*60-30, h=Math.floor(m/60), mm=String(m%60).padStart(2,'0'); return hh(h).replace(/^\d+/,(h>12?h-12:h)+':'+mm); }
function daysTxt(d){ const on=WEEK.filter(([k])=>d.days.includes(k)).map(x=>x[1]), off=WEEK.filter(([k])=>!d.days.includes(k)).map(x=>x[1]);

const bkYmd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function bkShift(ymd,step){ const d=new Date(ymd+'T12:00:00'); do{ d.setDate(d.getDate()+step); }while(d.getDay()===5); return bkYmd(d); } // Friday is off
function bkDues(appt){ const t=bkYmd(new Date()), c1=bkShift(appt,-1); return [c1<=t?'':c1, appt<=t||new Date(appt+'T12:00:00').getDay()===5?'':appt, bkShift(appt,1)]; }
function bkDay(ymd){ try{ return new Date(ymd+'T12:00:00').toLocaleDateString(EN?'en-GB':'ar-EG',{weekday:'long',day:'numeric',month:'short'}); }catch(e){ return ymd; } }

  return '<div class="wa-box" id="bkFu"><b>'+B.fuH+'</b>'+list+(signed?'':'<div class="small" style="margin-top:6px;color:var(--rose)">🔒 '+B.fuSign+'</div>')+'</div>'; }

  const j=await window.kbBookSave({id:bkId(),mode:BK.mode,oldDate:BK.oldDate,oldTime:BK.oldTime,name:BK.name,phone:BK.phone,branch:BK.branch,svc:BK.svc,doc:BK.doc,kind:kindTxt,date:BK.date,time:BK.time,odoo:BK.odoo,notes:BK.notes});
  setTimeout(()=>toast(!(j&&j.ok)?B.notSaved:j.duplicate?B.savedDup:j.none?B.noneOk:j.updated==='cancel'?B.cancelOk:j.updated==='move'?B.movedOk:BK.mode==='move'?B.movedNew:B.saved),600); }
function bkHtml(){

   ${M!=='new'?`<div class="small" style="background:var(--soft);border-radius:10px;padding:8px 10px">${B.mIntro[M]}</div>`:''}
   ${M==='new'?`<div class="wa-lbl">${B.kind}</div>${chips('kind',B.k)}<div class="wa-lbl">${B.src}</div>${chips('src',B.s)}`:''}
   ${inp('name')}${inp('phone','05xxxxxxxx','tel',1)}
   <label>${B.branch}<select id="bk_branch" data-bk="branch" class="wa-sel"><option value="">–</option>${BRANCHES.map(b=>`<option value="${esc(b.city)}" ${BK.branch===b.city?'selected':''}>${esc(b.city)}</option>`).join('')}</select></label>
   <label>${B.svc}<input id="bk_svc" data-bk="svc" list="bkSvcList" autocomplete="off" placeholder="🔍" value="${esc(BK.svc)}"><datalist id="bkSvcList">${svc.map(o=>`<option value="${esc(o)}">`).join('')}</datalist></label>

function bkMail(){ const me=teamBy(meGet()); const need=(m,id)=>{ toast(m); const s=$(id); if(s) s.focus(); return null; };

  if(!BK.name.trim()) return need(B.needName,'bk_name');
  const M=BK.mode;
  if(M!=='new'&&!BK.phone.trim()) return need(B.needPhone,'bk_phone');
  if(M==='new'&&!BK.svc.trim()) return need(B.needSvc,'bk_svc');
  if(M!=='cancel'&&(!BK.date||!BK.time)) return need(B.needDate,BK.date?'bk_time':'bk_date');
  const L=(k,v)=>v&&String(v).trim()?'\n'+k+': '+String(v).trim():'';
  const dayOf=v=>v?new Date(v+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short',year:'numeric'}):'';
  const tOf=v=>{ if(!v) return ''; const [hh,mm]=v.split(':').map(Number); return ((hh%12)||12)+':'+String(mm).padStart(2,'0')+(hh<12?' AM':' PM'); };
  const day=dayOf(BK.date), t12=tOf(BK.time), when=(day+(t12?' '+t12:'')).trim();
  if(M==='move'){ const old=(dayOf(BK.oldDate)+' '+tOf(BK.oldTime)).trim();
    return {s:'Booking moved: '+BK.name.trim()+' | new: '+when+(BK.branch?' | '+BK.branch:''),
      b:'Hi Mostafa, Eslam,\n\nThe customer changed the day of their booking.\n'+L('Customer',BK.name)+L('Number',BK.phone)+(old?'\nOld appointment: '+old:'')+'\nNew appointment: '+when+L('Branch',BK.branch)+L('Offer / service',BK.svc)+L('Doctor',BK.doc)+L('Odoo',BK.odoo)
       +(BK.notes.trim()?'\n\nNotes:\n'+BK.notes.trim():'')+'\n\nWhatsApp confirmation sent: '+(BK.wa?'Yes':'Not yet')+'\n\nChanged on: '+new Date().toLocaleDateString('en-GB')+' '+hhmm()+'\n\nThanks,\n'+me.en}; }
  if(M==='cancel') return {s:'Booking cancelled: '+BK.name.trim()+(when?' | '+when:'')+(BK.branch?' | '+BK.branch:''),
      b:'Hi Mostafa, Eslam,\n\nThe customer cancelled their booking.\n'+L('Customer',BK.name)+L('Number',BK.phone)+(when?'\nAppointment was: '+when:'')+L('Branch',BK.branch)+L('Offer / service',BK.svc)+L('Odoo',BK.odoo)
       +(BK.notes.trim()?'\n\nReason:\n'+BK.notes.trim():'')+'\n\nCancelled on: '+new Date().toLocaleDateString('en-GB')+' '+hhmm()+'\n\nThanks,\n'+me.en};
  const s='New booking: '+K_EN[BK.kind]+' | '+BK.name.trim()+' | '+day+' '+t12+(BK.branch?' | '+BK.branch:'');
  const b='Hi Mostafa, Eslam,\n\nA new booking, details below.\n\nBooking for: '+K_EN[BK.kind]+L('Customer',BK.name)+L('Number',BK.phone)+L('Branch',BK.branch)+L('Offer / service',BK.svc)+L('Doctor',BK.doc)
   +'\nAppointment: '+day+', '+t12+'\nGift: '+G_EN[BK.gift]+'\nCame from: '+S_EN[BK.src]+L('Odoo',BK.odoo)
   +(BK.notes.trim()?'\n\nNotes:\n'+BK.notes.trim():'')
   +'\n\nWhatsApp confirmation sent: '+(BK.wa?'Yes':'Not yet')
   +'\n\nBooked on: '+new Date().toLocaleDateString('en-GB')+' '+hhmm()+'\n\nThanks,\n'+me.en;
  return {s,b}; }

document.addEventListener('change',e=>{ const k=e.target.dataset&&e.target.dataset.bk; if(k&&e.target.id==='bk_'+k) BK[k]=e.target.value; if(e.target.id==='bkWa') BK.wa=e.target.checked;

document.addEventListener('click',e=>{ const t=e.target.closest('[data-a]'); if(!t) return; const a=t.dataset.a; if(!a.startsWith('bk')) return; e.preventDefault();

 at 5.\""], "o": [["أحدد Next activity على أودوو بكرة الساعة 5 بتذكير، وأتصل في الميعاد", "Set a Next activity on Odoo for tomorrow at 5 with a reminder, and call on time"], ["أكتبها في ورقة جنبي", "Write it on a piece of paper"], ["أتصل بيها لما أفتكر", "Call her whenever I remember"], ["أتصل بيها النهارده تاني علشان ألحقها", "Call her again today to catch her"]], "a": 0, "w": ["حط المكالمة كـ Activity على أودوو بتذكير، واتصل في الميعاد اللي وعدت بيه.", "Add the call as an Activity on Odoo with a reminder, and call when you promised."]}, {"id": "sc-close", "s": 1, "q": ["العميلة حجزت. إيه أحسن حاجة تعملها قبل ما تقفل؟", "The customer booked. What's the best thing to do before ending the call?"], "o": [["أكرر الخدمة والفرع والعلامة المميزة واليوم والساعة وأي تعليمات قبل الزيارة", "Repeat the service, branch, landmark, day, time and any pre-visit instructions"], ["أقفل على طول علشان ألحق المكالمة اللي بعدها", "End right away to get to the next call"], ["أبعتلها العنوان بعدين", "Send her the address later"], ["أسألها لو عايزة تحجز خدمة تانية وبس", "Only ask if she wants another service"]], "a": 0, "w": ["قبل ما تقفل، كرر الخدمة والفرع والعلامة المميزة واليوم والساعة وأي تعليمات قبل الزيارة، وراجعهم على أودوو.", "Before ending, repeat service, branch, landmark, day, time and pre-visit instructions, and check them on Odoo."]}, {"id": "sc-rival", "s": 1, "q": ["العميلة قالت: \"المركز اللي جنبكم أرخص.\"", "The customer says: \"The center next to you is cheaper.\""], "o": [["أحترم اختيارها، وأركّز على اللي بنقدمه وعلى الاستشارة المجانية مع الدكتور", "Respect her choice, and focus on what we offer and the free consultation with the doctor"], ["أقولها إن المركز ده أجهزته وحشة", "Tell her that center's devices are bad"], ["أقولها إن دكاترتهم مش شاطرين", "Tell her their doctors aren't good"], ["أنزل السعر من عندي", "Lower the price myself"]], "a": 0, "w": ["خلي كلامك عن العيادة والدكاترة والزملاء والمنافسين إيجابي أو محايد.", "Keep what you say about the clinic, doctors, colleagues and competitors positive or neutral."]}, {"id": "sc-dup", "s": 1, "q": ["جالك رقم جديد وعايز تعمله ليد على أودوو. أول خطوة؟", "You got a new number and want to create a lead on Odoo. First step?"], "o": [["أدوّر برقم التليفون على أودوو الأول", "Search Odoo by the phone number first"], ["أعمل ليد جديد على طول", "Create a new lead straight away"], ["أسأل زميلتي لو تعرف الرقم", "Ask a colleague if she knows the number"], ["أستنى العميلة تتصل تاني", "Wait for the customer to call back"]], "a": 0, "w": ["دوّر برقم التليفون على أودوو قبل ما تعمل ليد أو Activity جديد علشان متكررش.", "Search Odoo by phone number before creating a lead or Activity, so there are no duplicates."]}];
const QZ_ITEMS={"1": {"a": "سرعة التحية", "ac": "ابدأ الكلام أول ما الخط يفتح، وخلّي جملة الافتتاح جاهزة قبل ما تتصل.", "e": "Quick greeting", "ec": "Start speaking as soon as the call connects; have the opening line ready before dialling."}, "2": {"a": "تعريف واضح", "ac": "قول اسمك واسم 'مركز H&P الطبي' بوضوح في أول المكالمة دايمًا.", "e": "Clear introduction", "ec": "Always say your name and 'H&P Medical Center' clearly at the start."}, "3": {"a": "سبب المكالمة", "ac": "وضّح بتتصل ليه (استفسارها / العرض / الفولو أب) وادخل بالاستشارة المجانية على طول. ولو قالت إنها مشغولة، حدد معاها ميعاد Call back.", "e": "Reason for the call", "ec": "Say why you are calling (her enquiry / the offer / the follow-up) and lead with the free consultation right away. If she says she is busy, set a call back time."}, "4": {"a": "فهم الاحتياج", "ac": "اسأل 2–3 أسئلة على الأقل عن المشكلة والمنطقة والعلاجات السابقة والتوقعات قبل ما تقول أي سعر.", "e": "Needs discovery", "ec": "Ask at least 2–3 questions about the concern, area, previous treatments and expectations before mentioning any price."}, "5": {"a": "استكشاف الفولو أب", "ac": "اسأل الاستشارة كانت عاملة إزاي، ودوّر على السبب الحقيقي لعدم الحجز قبل ما تعرض أي حاجة.", "e": "Follow-up discovery", "ec": "Ask how the consultation went and dig into the real reason for not booking (price, timing, doubts, doctor's advice) before offering anything."}, "6": {"a": "الاستماع الجيد", "ac": "سيب العميل يخلص كلامه، وبعدين أكّد اللي فهمته ('يعني أكتر حاجة مضايقاكي…') قبل ما ترد.", "e": "Active listening", "ec": "Let the customer finish, then confirm what you heard ('so your main concern is…') before answering."}, "7": {"a": "ربط العرض بالاحتياج", "ac": "اعرض عرض واحد مناسب للي قالته، وابدأ بالفايدة بدل ما تقرا قايمة العروض.", "e": "Linking the offer to the need", "ec": "Present one offer that matches what she told you, benefit first, instead of reading the offers list."}, "8": {"a": "بيع الاستشارة المجانية", "ac": "وضّح قيمة الاستشارة المجانية: دكتور هيقيّم حالتها، والفولو أب كمان مجاني.", "e": "Selling the free consultation", "ec": "Explain the value of the free consultation: a doctor assesses her case and the follow-up is free too."}, "9": {"a": "التعامل مع الاعتراضات", "ac": "استخدم: تفهّم، وضّح، رد، وبعدين اعرض تاني. ودرّب نفسك على أشهر اعتراضين في الجايد.", "e": "Objection handling", "ec": "Use acknowledge, clarify, answer, then ask again; practise the two top objections from the guide."}, "10": {"a": "استلام الشكوى", "ac": "اسمع واعتذر عن التجربة، وخد الاسم والرقم والفرع والتاريخ والمشكلة، ووضّح إن فريق العيادة هيتابع. من غير وعود.", "e": "Complaint intake", "ec": "Listen, apologise for the experience, collect name, number, branch, date and issue, and explain the clinic team will follow up. No promises."}, "11": {"a": "وضوح الخطوة الجاية", "ac": "قبل ما تقفل، كرر الخدمة والفرع والعلامة المميزة واليوم والساعة وأي تعليمات قبل الزيارة.", "e": "Clear next step", "ec": "Before closing, repeat the service, branch and landmark, date and time, and any pre-visit instructions."}, "12": {"a": "إنهاء لطيف", "ac": "اعرض مساعدة إضافية واستخدم جملة القفل، ومتقفلش فجأة.", "e": "Polite closing", "ec": "Offer further help and use the closing line; don't end abruptly."}, "13": {"a": "نبرة الصوت", "ac": "ابتسم وإنت بتتكلم، وحافظ على سرعة وطاقة ثابتة. اسمع المكالمة تاني عشان تحس بالفرق.", "e": "Tone of voice", "ec": "Smile while talking, keep a steady pace and energy; listen back to this call to hear the difference."}, "14": {"a": "لغة مناسبة", "ac": "استخدم عربي واضح يفهمه العميل في الإمارات، وابعد عن العامية المصرية والمصطلحات الإنجليزي. راجع صفحة المصطلحات الخليجية.", "e": "Language fit", "ec": "Use clear Arabic that a UAE customer understands; avoid Egyptian slang and English jargon. Review the Gulf terms page."}, "15": {"a": "التعاطف والألفة", "ac": "اعترف بقلق العميل قبل ما ترد، وخلي أسلوبك محترم طول المكالمة.", "e": "Empathy and rapport", "ec": "Acknowledge her concern before answering and address her respectfully throughout."}, "16": {"a": "لغة مهنية", "ac": "بدّل العبارات السلبية ('مقدرش') باللي تقدر تعمله، وخليك ودود بس مهني.", "e": "Professional language", "ec": "Replace negative phrases ('I can't') with what you can do; keep it warm but professional."}, "17": {"a": "الانتظار والسكوت", "ac": "استأذن قبل الانتظار، وخليه أقل من دقيقة، واشكر العميل بعده. واملا السكوت وإنت بتدوّر على المعلومة.", "e": "Hold and dead air", "ec": "Ask before placing on hold, keep it under 1 minute, thank her after; fill silences while you check information."}, "18": {"a": "ملاحظات أودوو", "ac": "راجع ملاحظاتك على أودوو قبل الحفظ، وخليها قصيرة وواضحة وكاملة.", "e": "Odoo notes", "ec": "Re-read your Odoo notes before saving; keep them short, clear and complete."}, "C1": {"a": "يدّي نصيحة طبية أو تشخيص أو يقرر الحالة تنفع ولا لأ بدل ما يحوّل للدكتور", "ac": "متدّيش رأي طبي أبدًا. قول: 'الدكتور هيقيّم ده في الاستشارة المجانية' واحجزها.", "e": "Gives medical advice, a diagnosis or a suitability decision instead of referring to the doctor", "ec": "Never advise on medical suitability. Say: 'The doctor will assess this in the free consultation' and book it.", "c": 1}, "C2": {"a": "يوعد بنتايج أو يستخدم ادعاءات مش معتمدة", "ac": "استخدم الكلام المعتمد بس: 'النتايج بتختلف من شخص للتاني'. ومتقولش 'مضمون' أو 'دايم' أو '100%' أو وعود بالكيلو.", "e": "Promises results or uses unapproved claims", "ec": "Use only approved wording: 'results vary from person to person'. Never 'guaranteed', 'permanent', '100%' or kg promises.", "c": 1}, "C3": {"a": "مش ملتزم بقاعدة الحمل", "ac": "راجع قاعدة الحمل: Hold ومكالمة بعد الولادة. ومتحجزش غير لو هي أصرّت، واكتب ده.", "e": "Pregnancy rule not followed", "ec": "Review the pregnancy rule: put her on Hold and schedule a call after delivery; book only if she insists, and note it.", "c": 1}, "C4": {"a": "يقول أرقام مش معتمدة", "ac": "متقولش نسبة الضريبة أو رسوم التقسيط أو عدد الجلسات. قول إن التفاصيل دي بتتأكد قبل الحجز.", "e": "Quotes unapproved figures", "ec": "Don't quote VAT %, installment fees or session counts. Say these details are confirmed before booking.", "c": 1}, "C5": {"a": "يتكلم في تفاصيل العلاج أو البيانات الشخصية قبل ما يتأكد إنه بيكلم صاحب الطلب", "ac": "اتأكد إنك بتكلم صاحبة الطلب نفسها قبل ما تتكلم في أي علاج أو بيانات شخصية.", "e": "Discusses treatment or personal details before confirming they are speaking to the lead", "ec": "Confirm you are speaking to the lead herself before discussing any treatment or personal details.", "c": 1}, "C6": {"a": "يستخدم حجة مضللة أو استعجال مش حقيقي", "ac": "استخدم الأسباب المعتمدة بس للاتصال، ومتخترعش مواعيد أو حجج.", "e": "Uses a misleading pretext or false urgency", "ec": "Use only the approved reasons for calling; never invent deadlines or pretexts.", "c": 1}, "C7": {"a": "يتجاهل طلب واضح 'متتصلش بيا' / مش مهتم", "ac": "احترم الرفض الواضح: اشكر العميل، وسجّل 'مش مهتم' على أودوو، ومتتصلش تاني.", "e": "Ignores a clear 'do not call me' / not-interested request", "ec": "Respect a clear refusal: thank the customer, mark 'Not interested' in Odoo and do not call again.", "c": 1}, "C8": {"a": "معلومة غلط في السعر أو العرض أو الهدية", "ac": "راجع شيت العروض قبل ما تقول السعر، وقول دايمًا إن الأسعار قبل الضريبة.", "e": "Wrong price, offer or gift information", "ec": "Check the offers sheet before quoting and always say prices are before VAT.", "c": 1}, "C9": {"a": "معلومات ناقصة العميل محتاجها", "ac": "استخدم قايمة الحجز: الفرع والعنوان، المواعيد، الاستشارة المجانية، تحضيرات الليزر، رسوم الحلاقة.", "e": "Missing information the customer needs", "ec": "Use the booking checklist: branch and address, hours, free consultation, pre-laser prep, shaving fee.", "c": 1}, "C10": {"a": "حجز غلط أو مش متسجل (اليوم، الساعة، الفرع، الخدمة)", "ac": "راجع اليوم والساعة والفرع والخدمة على أودوو قبل ما تقفل، واقراهم للعميل.", "e": "Wrong or missing booking (date, time, branch, service)", "ec": "Double-check date, time, branch and service in Odoo before ending the call, and read them back to the customer.", "c": 1}, "C11": {"a": "شكوى أو تجربة سلبية مش متسجلة على أودوو أو مش متصعّدة لفريق الإمارات", "ac": "سجّل أي شكوى أو تجربة سلبية على أودوو وصعّدها لفريق الإمارات في نفس اليوم.", "e": "Complaint or negative experience not logged in Odoo or not escalated to the UAE team", "ec": "Log every complaint or negative experience in Odoo and escalate it to the UAE team the same day.", "c": 1}, "C12": {"a": "مش بيصعّد لما يكون لازم (العميل طلب مشرف، أو طلب مش من صلاحية الإيجنت)", "ac": "لما العميل يطلب مشرف أو حاجة مش من صلاحيتك، قوله إنك هتوصّلها، وصعّدها للتيم ليدر في نفس اليوم.", "e": "Does not escalate when required (customer asks for a supervisor, or a request the agent is not allowed to decide)", "ec": "When a customer asks for a supervisor or something you can't decide, say you'll pass it on and escalate it to your team leader the same day.", "c": 1}, "C13": {"a": "مش بيتصل في ميعاد المكالمة اللي وعد بيه", "ac": "حط المكالمة كـ Activity على أودوو بتذكير، واتصل في الميعاد اللي وعدت بيه.", "e": "Does not call back at the promised time", "ec": "Set the callback as an Odoo activity with a reminder and call at the promised time.", "c": 1}, "C14": {"a": "قلة ذوق، أو جدال، أو ياخد الكلام بشكل شخصي", "ac": "خليك هادي ومحترم حتى لو العميل مش كده، ومتجادلش. واطلب دعم التيم ليدر في المكالمات الصعبة.", "e": "Rude, arguing, or takes things personally", "ec": "Stay calm and polite even when the customer is not; never argue. Ask the TL for support on difficult calls.", "c": 1}, "C15": {"a": "تهرّب من المكالمة أو قفلها", "ac": "متقفلش في وش العميل ومتتجاهلوش. ولو الخط وحش، اتصل تاني واكتب ده على أودوو.", "e": "Call avoidance or release", "ec": "Never hang up on or ignore a customer; if the line is bad, call back and note it in Odoo.", "c": 1}, "C16": {"a": "اسم المركز غلط", "ac": "عرّف المركز باسم 'مركز H&P الطبي' بس.", "e": "Wrong clinic name", "ec": "Introduce the clinic only as 'H&P Medical Center'.", "c": 1}, "C17": {"a": "مفيش أي محاولة لحجز أو عرض الاستشارة والعميل ينفع يحجز", "ac": const css=`.qz{display:grid;gap:12px}.qz .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qz .muted,.qstage .muted{color:var(--muted);font-size:13px}
.qbtn{font:inherit;font-size:16px;font-weight:800;border:0;border-radius:14px;padding:13px 20px;background:var(--sage);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
.qbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}.qbtn[disabled]{background:var(--line);color:var(--muted);cursor:default;transform:none}
.qbtn.rose{background:var(--rose)}.qbtn.wide{width:100%}
.qghost{font:inherit;font-size:14px;font-weight:700;border:2px solid var(--line);border-radius:12px;padding:9px 14px;background:var(--paper);color:var(--ink);cursor:pointer}
.qin{font:inherit;font-size:16px;width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--paper);color:var(--ink)}.qin:focus{outline:none;border-color:var(--sage)}
.qin.code{letter-spacing:8px;text-align:center;font-size:22px;font-weight:800;direction:ltr}
.qerr{color:var(--red);font-size:13.5px;font-weight:700}
.qhero{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center}.qhero .nr{width:88px;height:88px}
.qstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qstat{border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;display:grid;gap:2px}.qstat b{font-size:21px}.qstat span{font-size:12px;color:var(--muted)}
.qstat.fire b{color:#E8771A}.qstat.fire.off b{color:var(--muted)}.qstat.xp b{color:#C99700}
.qflame{display:inline-block}.qstat.fire:not(.off) .qflame{animation:qFlame 1.2s ease-in-out infinite alternate}
@keyframes qFlame{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.15) rotate(4deg)}}
.qlvl{display:grid;gap:5px}.qlvl .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
.qbar{width:100%;height:12px;border-radius:99px;background:var(--line);overflow:hidden}.qbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F7C548,#F08A24);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.qweek{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.qday{display:grid;gap:3px;justify-items:center;font-size:11px;color:var(--muted)}
.qday i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:15px;border:2px solid var(--line);background:var(--paper)}
.qday.ok i{background:#F08A24;border-color:#F08A24}.qday.today i{border-color:var(--sage);border-style:dashed}.qday.ok.today i{border-style:solid}.qday.off i{opacity:.45}
.qbadges{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.qbadge{border:2px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center;display:grid;gap:3px;font-size:12px;font-weight:700}.qbadge .e{font-size:26px}
.qbadge.lock{opacity:.4;filter:grayscale(1)}.qbadge.new{animation:qPop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes qPop{0%{transform:scale(.4)}100%{transform:none}}

// ---------- dates, seeded picks ----------
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date()), month=()=>today().slice(0,7);
const lastDay=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};
const monthOpen=()=>new Date().getDate()>=lastDay()-2;
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function priceQs(r){ // from the live offers: confirmed prices only
  const ok=OFFERS.filter(o=>o.st==='ok'&&/\d/.test(o.price||''));
  const multi=p=>/\//.test(p), cur=EN?' AED':' درهم';
  return shuffle(ok,r).map(o=>{const others=shuffle([...new Set(ok.map(x=>x.price).filter(p=>p!==o.price&&multi(p)===multi(o.price)))],r).slice(0,3);
    const opts=shuffle([o.price,...others],r);return{id:'p-'+o.id,q:U.priceQ(o.ar),o:opts.map(x=>x+cur),a:opts.indexOf(o.price),w:o.pn||''}}).filter(q=>q.o.length===4);
}
function build(kind,seed,practice){
  // Same quiz for everyone each day: offer prices, a customer scenario and general questions, plus "review" questions
  // the team got wrong most in the last 14 days (from the server, fixed for the day). Practice also brings back your own misses.
  const r=rng(seed+(practice?'-'+Date.now():''));
  const N=kind==='monthly'?15:5, nP=kind==='monthly'?5:2, nS=kind==='monthly'?4:1, nH=kind==='monthly'?5:1;
  const conv=b=>{const idx=shuffle([0,1,2,3],r);return{id:b.id,s:!!b.s,q:L(b.q),o:idx.map(i=>L(b.o[i])),a:idx.indexOf(b.a),w:L(b.w)}};
  const prices=priceQs(r), byId=id=>{ const b=QZ_BANK.find(x=>x.id===id); if(b) return conv(b); return prices.find(q=>q.id===id)||null; };
  const out=[], has=id=>out.some(q=>q.id===id), push=q=>{ if(q&&!has(q.id)&&out.length<N) out.push(q); };
  const review=[...(practice?ls.get('tj-quiz-mywrong',[]).slice().reverse():[]),...((PULSE&&PULSE.hard)||[])];
  review.slice(0,practice?nH+2:nH).forEach(id=>push(byId(id)));
  prices.filter(q=>!has(q.id)).slice(0,nP).forEach(push);
  shuffle(QZ_BANK.filter(b=>b.s&&!has(b.id)),r).slice(0,nS).forEach(b=>push(conv(b)));
  shuffle(QZ_BANK.filter(b=>!b.s&&!has(b.id)),r).forEach(b=>push(conv(b)));
  return shuffle(out,r);
}

let PULSE=null, PULSE_ERR=false;
async function api(body){ const r=await fetch(QZ_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}); return await r.json(); }
async function loadPulse(){ try{ const j=await (await fetch(QZ_API+'?action=pulse&month='+month()+(SES?'&session='+encodeURIComponent(SES.session):''))).json();
    if(j&&j.ok){ PULSE=j; PULSE_ERR=false; if(j.signedOut) signOut(); } else PULSE_ERR=true; }catch(e){PULSE_ERR=true}
  syncDashTab(); if((location.hash||'').slice(1)==='dash'&&canDash()&&VIEW!=='dash') setView('dash',true);
  if(VIEW==='quiz'&&!RUN) renderMain(); }
async function post(rec){ if(!SES) return {ok:false,error:'signed_out'}; try{ return await api(Object.assign({action:'quiz',session:SES.session},rec)); }catch(e){ return null; } }
async function flush(){ const p=ls.get(PEND,[]); if(!p.length||!SES) return; const keep=[]; for(const rec of p){ const j=await post(rec); if(!j||j.error==='signed_out') keep.push(rec); } ls.set(PEND,keep); if(keep.length<p.length) loadPulse(); }

// ---------- sound, buzz and confetti ----------
let AC=null;
function tone(seq){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const t0=AC.currentTime;
  seq.forEach(([f,at,len,type])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,t0+at); g.gain.exponentialRampToValueAtTime(.16,t0+at+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+at+len); o.connect(g).connect(AC.destination); o.start(t0+at); o.stop(t0+at+len+.05); }); }catch(e){} }
const sndOk=()=>tone([[659,0,.12],[988,.1,.22]]), sndBad=()=>tone([[196,0,.25,'triangle'],[147,.12,.3,'triangle']]), sndWin=()=>tone([[523,0,.15],[659,.12,.15],[784,.24,.15],[1047,.36,.4]]);
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function confetti(n){ if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas'); c.className='qconf'; c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c); const x=c.getContext('2d');
  const cols=['#58CC02','#F7C548','#F08A24','#E07BA0','#7DB3E6','#A63D63'], P=[];
  for(let i=0;i<(n||120);i++) P.push({x:c.width/2+(Math.random()-.5)*c.width*.3,y:c.height*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*15-5,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]});
  let f=0; (function step(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++f<110) requestAnimationFrame(step); else c.remove(); })(); }

function resultHtml(){ const R=RUN, {score,total,msg}=R.result, pct=Math.round(100*score/total), m=ME(), b=R.before;

async function finishRun(){ const R=RUN, score=R.ans.filter(Boolean).length, total=R.qs.length;
  { const mw=ls.get('tj-quiz-mywrong',[]).filter(id=>!R.qs.some((q,i)=>q.id===id&&R.ans[i])); R.qs.forEach((q,i)=>{ if(!R.ans[i]&&!mw.includes(q.id)) mw.push(q.id); }); ls.set('tj-quiz-mywrong',mw.slice(-20)); }
  R.result={score,total,msg:''}; sndWin(); if(score>=Math.ceil(total*.6)) confetti(score===total?180:90);
  stage();
  if(!R.practice&&SES){ ls.set(doneKey(R.kind,R.per),{score,total});
    const rec={kind:R.kind,score,total,wrong:R.qs.filter((q,i)=>!R.ans[i]).map(q=>q.id+' — '+String(q.q).slice(0,110)),asked:R.qs.map(q=>q.id+' — '+String(q.q).slice(0,110))};
    const j=await post(rec), queue=()=>{ const p=ls.get(PEND,[]); p.push(rec); ls.set(PEND,p); };
    if(!j){ queue(); R.result.msg=U.notSaved; }
    else if(!j.ok){ if(j.error==='signed_out'){ queue(); R.result.msg=U.signedOut; signOut(); } else R.result.msg=U.notSaved; }

function t12(t){ if(!t) return ''; const [h,m]=t.split(':').map(Number); return ((h%12)||12)+':'+String(m).padStart(2,'0')+(EN?(h<12?' AM':' PM'):(h<12?' ص':' م')); }
function fuItem(x){ const k=fuKey(x), open=FU.open===k, res3=x.call===3?['went','noshow','noanswer']:['confirmed','noanswer','rescheduled','cancelled'];
  const hint=F.hint[x.call].replace(/\[(الساعة|time)\]/g,t12(x.time)||'…').replace(/\[(الفرع|branch)\]/g,x.branch||'…');
  const lead=CALLS&&CALLS.lead;
  return `<div class="fitem ${x.state==='late'?'late':''}" id="fu-${k}"><div class="h"><span class="fpill c${x.call}">${x.call}. ${F.c[x.call]}</span><span>${F.cs[x.call]}</span>${x.state==='late'?`<span class="fpill late">${F.late}</span>`:''}${x.state==='soon'?`<span>· ${esc(dayLbl(x.due))}</span>`:''}${x.tries?`<span>· ${esc(F.tries(x.tries))}</span>`:''}${lead?`<span>· ${F.agent} <b>${esc(x.to)}</b></span>${x.off?`<span class="fpill off">${x.state==='soon'?F.offDay:F.off}</span>`:''}`:''}</div>
   <div class="t">${esc(x.cust)}</div>
   <div class="meta"><span><b>${F.appt}</b>${esc(dayLbl(x.date))} ${esc(t12(x.time))}</span>${x.branch?`<span><b>${EN?'Branch':'الفرع'}</b>${esc(x.branch)}</span>`:''}${x.svc?`<span><b>${EN?'Service':'الخدمة'}</b>${esc(x.svc)}</span>`:''}${x.doc?`<span><b>${EN?'Doctor':'الدكتور'}</b>${esc(x.doc)}</span>`:''}
    ${x.phone?`<span><b>${F.phone}</b><a class="ftel" href="tel:${esc(x.phone.replace(/[^\d+]/g,''))}">${esc(x.phone)}</a> <button class="qghost" style="padding:3px 8px;font-size:12px" data-a="fucopy" data-v="${esc(x.phone)}">${F.copyN}</button></span>`:''}${x.odoo?`<span><b>Odoo</b>${esc(x.odoo)}</span>`:''}</div>
   ${x.notes?`<div class="muted" style="white-space:pre-line;font-size:13px">📝 ${esc(x.notes)}</div>`:''}
   ${x.state!=='soon'||lead?`<div class="fhint">💬 ${esc(hint)}</div><div class="fbtns">${res3.map(r=>`<button data-a="fures" data-k="${k}" data-v="${r}" class="${open&&FU.res===r?'on':''}">${F.r[r]}</button>`).join('')}</div>`:''}
   ${open?`<div class="fform">${FU.res==='rescheduled'?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label class="lbl">${F.newDate}<input class="qin" type="date" id="fuDate" value="${esc(FU.date)}"></label><label class="lbl">${F.newTime}<input class="qin" type="time" id="fuTime" value="${esc(FU.time)}"></label></div>`:''}
     ${FU.res==='went'?`<div class="lbl">${F.rate}</div><div class="fstars">${[1,2,3,4,5].map(n=>`<button data-a="furate" data-v="${n}" class="${FU.rate>=n?'on':''}">⭐</button>`).join('')}</div>`:''}
     <label class="lbl" for="fuNote">${F.note}</label><input class="qin" id="fuNote" placeholder="${esc(FU.res==='went'||FU.res==='noshow'?F.fbPh:F.notePh)}" value="${esc(FU.note)}">
     ${FU.err?`<div class="qerr">${esc(FU.err)}</div>`:''}
     <div class="row"><button class="qbtn" data-a="fusave" data-k="${k}" ${FU.busy?'disabled':''}>${F.save}</button><button class="qghost" data-a="fuback">${F.cancel}</button></div></div>`:''}
   ${lead?`<div class="row"><select class="qin" style="max-width:240px;padding:7px 10px;font-size:14px" data-a="fugive" data-id="${x.id}"><option value="">${F.give}</option>${(CALLS.agents||[]).filter(a=>a!==x.to).map(a=>`<option>${esc(a)}</option>`).join('')}</select></div>`:''}
  </div>`; }
function followHtml(){ const head=`<div class="sh"><div class="eyebrow">${F.eyebrow}</div><h2>${F.title}</h2><p>${F.intro}</p></div>`;
  if(!SES) return `<section id="follow" class="qz fu">${head}<div class="panel" style="display:grid;gap:10px"><div class="muted">${F.signFirst}</div><button class="qbtn" data-a="fusign">${F.signGo}</button></div></section>`;
  if(!CALLS) return `<section id="follow" class="qz fu">${head}<div class="panel"><div class="muted">${CALLS_ERR?F.offline:'…'}</div></div></section>`;
  const L=CALLS.items.filter(x=>x.state!=='missed'&&(FU.all||x.mine||!CALLS.lead)), now=L.filter(x=>x.state==='due'||x.state==='late').sort((a,b)=>(b.state==='late')-(a.state==='late')||a.call-b.call||(a.time||'').localeCompare(b.time||''));
  const soon=L.filter(x=>x.state==='soon').sort((a,b)=>a.due.localeCompare(b.due)||(a.time||'').localeCompare(b.time||'')).slice(0,40);
  return `<section id="follow" class="qz fu">${head}
   ${CALLS.lead?`<div class="ask"><div class="seg"><button data-a="fuall" data-v="0" class="${FU.all?'':'on'}">${F.mineT}</button><button data-a="fuall" data-v="1" class="${FU.all?'on':''}">${F.allT}</button></div></div>`:''}
   <div class="panel" style="display:grid;gap:10px"><b>${F.todayT} (${now.length})</b>${now.length?now.map(fuItem).join(''):`<div class="muted">${F.noneToday}</div>`}</div>
   <div class="panel" style="display:grid;gap:10px"><b>${F.soonT} (${soon.length})</b>${soon.length?soon.map(fuItem).join(''):`<div class="muted">${F.noneSoon}</div>`}</div></section>`; }
SEC.follow=followHtml;
{ const i=VIEWS.findIndex(v=>v[0]==='booking'); VIEWS.splice(i<0?3:i+1,0,['follow',F.tab,['follow']]); }
async function fuSave(k){ const x=CALLS.items.find(y=>fuKey(y)===k); if(!x) return; FU.note=(($('fuNote')||{}).value||'').trim();
  if(FU.res==='rescheduled'){ FU.date=($('fuDate')||{}).value||''; FU.time=($('fuTime')||{}).value||''; if(!FU.date||FU.date<today()){ FU.err=F.errs.bad_date; renderMain(); return; } }
  FU.busy=true; FU.err=''; renderMain(); let j=null;
  try{ j=await api({action:'kbCall',session:SES.session,id:x.id,call:x.call,result:FU.res,note:FU.note,rating:FU.res==='went'?FU.rate:0,date:FU.date,time:FU.time}); }catch(e){}
  FU.busy=false;
  if(!j||!j.ok){ FU.err=(j&&F.errs[j.error])||(j&&j.error==='signed_out'?U.signedOut:U.errs.net); if(j&&j.error==='signed_out') signOut(); renderMain(); return; }
  const res=FU.res, nd=FU.date, nt=FU.time, note=FU.note;
  FU.open=''; FU.res=''; FU.note=''; FU.rate=0; toast(F.saved);
  if(res==='rescheduled'||res==='cancelled'){ // the team leads get the same email as from the booking tab
    const L=(k,v)=>v&&String(v).trim()?'\n'+k+': '+String(v).trim():'', w=(d,t)=>(d?new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short',year:'numeric'}):'')+(t?' '+t12(t).replace(' ص',' AM').replace(' م',' PM'):'');
    const old=w(x.date,x.time), s=res==='cancelled'?'Booking cancelled: '+x.cust+' | '+old+(x.branch?' | '+x.branch:''):'Booking moved: '+x.cust+' | new: '+w(nd,nt)+(x.branch?' | '+x.branch:'');
    const b='Hi Mostafa, Eslam,\n\n'+(res==='cancelled'?'The customer cancelled their booking.':'The customer changed the day of their booking.')+'\n'+L('Customer',x.cust)+L('Number',x.phone)+(res==='cancelled'?'\nAppointment was: '+old:'\nOld appointment: '+old+'\nNew appointment: '+w(nd,nt))+L('Branch',x.branch)+L('Offer / service',x.svc)+L('Doctor',x.doc)+L('Odoo',x.odoo)
      +(note?'\n\n'+(res==='cancelled'?'Reason':'Notes')+':\n'+note:'')+'\n\n(From a follow-up call: '+F.c[x.call]+')\n\nThanks,\n'+SES.name;
    location.href=mailto([LEADS.mostafa,LEADS.eslam],[LEADS.hussein],s,b); }
  await loadCalls(); }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b||!b.dataset.a.startsWith('fu')) return; const a=b.dataset.a; if(b.tagName==='SELECT') return; e.preventDefault();
  if(a==='fugo'){ FU.bar=false; fuBar(); setView('follow'); }
  else if(a==='fux'){ FU.bar=false; fuBar(); }
  else if(a==='fusign') setView('quiz');
  else if(a==='fuall'){ FU.all=b.dataset.v==='1'; renderMain(); }
  else if(a==='fucopy') copyText(b.dataset.v,F.copied);
  else if(a==='fures'){ const k=b.dataset.k; if(FU.open!==k){ FU.note=''; FU.rate=0; FU.date=''; FU.time=''; } FU.open=k; FU.res=b.dataset.v; FU.err=''; renderMain(); const el=$('fu-'+k); if(el) el.scrollIntoView({block:'nearest'}); }
  else if(a==='furate'){ FU.note=(($('fuNote')||{}).value||''); FU.rate=+b.dataset.v; renderMain(); }
  else if(a==='fuback'){ FU.open=''; FU.res=''; renderMain(); }
  else if(a==='fusave') fuSave(b.dataset.k); });
document.addEventListener('input',e=>{ if(e.target.id==='fuNote') FU.note=e.target.value; else if(e.target.id==='fuDate') FU.date=e.target.value; else if(e.target.id==='fuTime') FU.time=e.target.value; });
document.addEventListener('change',async e=>{ if(e.target.dataset&&e.target.dataset.a==='fugive'&&e.target.value&&SES){ const to=e.target.value;
  const j=await api({action:'kbAssign',session:SES.session,id:+e.target.dataset.id,to}).catch(()=>null); toast(j&&j.ok?F.given:((j&&F.errs[j.error])||U.errs.net)); loadCalls(); } });
// the booking tab saves each booking here (it lives outside this script)
window.kbSignedIn=()=>!!SES;
window.kbBookSave=async function(bk){ if(!SES) return {ok:false,error:'signed_out'}; try{ const j=await api({action:'kbBook',session:SES.session,booking:bk}); if(j&&j.ok) setTimeout(loadCalls,300); return j||{ok:false}; }catch(e){ return {ok:false,error:'net'}; } };
{ const _sync=syncDashTab; syncDashTab=function(){ _sync(); if(SES&&!CALLS) loadCalls(); else if(!SES&&CALLS){ CALLS=null; fuSync(); } }; }
{ const _set=setView; setView=function(v,n){ _set(v,n); fuBar(); if(v==='follow') loadCalls(); }; }
setInterval(()=>{ if(SES&&document.visibilityState==='visible') loadCalls(); },10*60*1000);
loadCalls();
{ const hv=(location.hash||'').slice(1); if(hv==='follow') setTimeout(()=>setView('follow',true),0); }
linkTeam();
renderTabs();

loadPulse().then(()=>{ const n=$('qzPopNotes'); if(n) n.innerHTML=notesHtml(3); }).finally(()=>setTimeout(popup,300));
flush();
})();
