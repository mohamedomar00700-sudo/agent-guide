<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#10161D; --paper:#18212B; --soft:#1F2A36; --ink:#E6EBF0; --muted:#9AA6B3; --line:#2C3947;

:root[data-theme="dark"]{color-scheme:dark;
  --bg:#10161D; --paper:#18212B; --soft:#1F2A36; --ink:#E6EBF0; --muted:#9AA6B3; --line:#2C3947;
  --rose:#E07BA0; --rose-soft:#3A2230; --sage:#5DC0A6; --sage-soft:#17332C; --amber:#E9AE52; --amber-soft:#3A2C15; --red:#EE7F73; --red-soft:#3C201D; --head:#0B1117; --head2:#141E28; --head-ink:#E6EBF0; --shadow:0 12px 32px rgba(0,0,0,.5)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--f)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate}
h1,h2,h3{font-family:var(--d);text-wrap:balance;line-height:1.35}

.top{background:var(--head);color:var(--head-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.bar{max-width:1100px;margin:0 auto;padding:10px 16px;display:grid;gap:10px;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center}
@media (max-width:700px){.bar{grid-template-columns:minmax(0,1fr) auto auto}.brand{display:none!important}}
.brand{display:grid;line-height:1.25}
.brand b{font-family:var(--d);font-size:17px}
.brand span{font-size:12px;opacity:.7}
.sbox{position:relative}
.sbox input{width:100%;border:0;border-radius:10px;padding:10px 42px 10px 14px;background:rgba(255,255,255,.1);color:var(--head-ink);font-size:16px}
[dir=ltr] .sbox input{padding:10px 14px 10px 42px}
.sbox input::placeholder{color:rgba(238,242,246,.6)}
.sbox svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.7}
.study{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:var(--head-ink);border-radius:9px;padding:8px 12px;font-size:14px;white-space:nowrap}
.study.on{background:var(--amber);border-color:var(--amber);color:#241700}
.sw{width:30px;height:16px;border-radius:9px;background:rgba(255,255,255,.3);position:relative;display:inline-block;flex:none}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:right .15s}
.study.on .sw{background:rgba(0,0,0,.25)}.study.on .sw::after{right:16px}
@media (max-width:700px){.study .t{display:none}}
.tabs{background:var(--head2);border-top:1px solid rgba(255,255,255,.08)}
.tabs-in{max-width:1100px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-inline:12px}
.tabs-in::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--head-ink);opacity:.72;padding:8px 12px 9px;white-space:nowrap;font-size:14px}
.tabs button:hover{opacity:1}
.tabs button.on{opacity:1;border-bottom-color:var(--rose);font-weight:700}
.tabs .sep{width:1px;background:rgba(255,255,255,.18);margin:8px 6px}

main{max-width:1100px;margin:0 auto;padding-block:18px 60px;padding-inline:16px;display:grid;gap:32px}
section{display:grid;gap:14px;scroll-margin-top:calc(var(--hh) + 14px)}
.sh{display:grid;gap:4px}
.sh h2{margin:0;font-size:22px}
.sh p{margin:0;color:var(--muted);max-width:75ch}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--rose)}
.notes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.note{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;display:grid;gap:2px}
.note b{font-size:14.5px}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;padding:1px 9px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
.c-ok{background:var(--sage-soft);color:var(--sage)}
.c-warn{background:var(--amber-soft);color:var(--amber)}
.c-no{background:var(--red-soft);color:var(--red)}
.c-cat{background:var(--soft);color:var(--muted)}
.studybar{background:var(--amber-soft);border-radius:10px;padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
.studybar b{font-family:var(--d)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 12px;font-size:13.5px}

.offers{display:grid;gap:10px}
.cathead{font-family:var(--d);font-size:16px;margin:10px 0 0;display:flex;gap:8px;align-items:center}
.cathead .n{font-family:var(--m);font-size:12px;color:var(--muted)}
.offer{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ohead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 16px;align-items:center;width:100%;background:none;border:0;text-align:start}
.ohead h3{margin:0;font-size:16.5px}
.ohead .en{display:block;font-size:12.5px;color:var(--muted);text-align:right}
.ohead .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.price{text-align:end;display:grid;gap:2px;justify-items:end}
.price .v{font-family:var(--m);font-size:19px;font-weight:600;white-space:nowrap}
.price .v small{font-size:12px;color:var(--muted);font-weight:500}
.price .n{font-size:12px;color:var(--muted);max-width:220px}
.hidep{display:inline-block;border:1px dashed var(--amber);color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:2px 10px;font-family:var(--f);font-size:13px;font-weight:500}
.obody{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:12px}
.two{display:grid;gap:12px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.say{background:var(--sage-soft);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.say p{margin:0;font-size:15.5px}
.qa{display:grid;gap:8px}
.qa div{display:grid;gap:2px}
.qa .q{font-weight:500}
.qa .q::before{content:"Customer: ";color:var(--muted);font-weight:400;font-size:13px}
.qa .a::before{content:"You: ";color:var(--sage);font-weight:700;font-size:13px}
.caution{background:var(--amber-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.caution.no{background:var(--red-soft)}
.src{font-size:12px;color:var(--muted)}

.tw{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{background:var(--soft);color:var(--muted);font-weight:500;text-align:start;padding:9px 12px;white-space:nowrap;position:sticky;top:0}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
td.m{font-family:var(--m);white-space:nowrap;font-weight:600}
tr.grp td{background:var(--soft);font-family:var(--d);font-weight:700;font-size:14px}
.empty{padding:24px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px}
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.totop{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:33;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow)}

[dir=ltr] .sbox svg{right:auto;left:14px}
[dir=ltr] .sbox kbd{left:auto;right:12px}
[dir=ltr] ol.tline2 li::before{right:auto;left:-7px}
[dir=ltr] .fab{left:auto;right:16px}
[dir=ltr] .totop{right:auto;left:16px}
[dir=ltr] .sw::after{right:auto;left:2px;transition:left .15s}
[dir=ltr] .study.on .sw::after{left:16px}
</style>

const REGULAR=[
 {id:'beard',ar:'Beard laser',pn:'3 sessions',price:'300',src:'The client, 5 Oct',laser:true},
 {id:'underarm',ar:'Underarm laser',pn:'4 sessions',price:'300',src:'The client, 5 Oct',laser:true},
 {id:'kysse',ar:'Restylane Kysse lip filler',pn:'',price:'1,100',src:'The client, 5 Oct'}
];



const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const stChip=s=>s==='ok'?'<span class="chip c-ok">Confirmed</span>':s==='warn'?'<span class="chip c-warn">Needs confirmation</span>':'<span class="chip c-no">Price not available</span>';
let CAT='all', Q='', STUDY=false, OPEN=new Set(), SHOWN=new Set();
try{STUDY=localStorage.getItem('hp-offers-study')==='1'}catch(e){}

function priceHtml(o){
  if(o.price==='—') return '<span class="v">—</span>';
  if(STUDY&&!SHOWN.has(o.id)) return `<span class="hidep" data-a="reveal" data-v="${o.id}" role="button" tabindex="0">Tap to see the price</span>`;
  return `<span class="v">${esc(o.price)} <small>AED</small></span>`;
}
const hideNums=t=>String(t).replace(/\d{1,3}(,\d{3})+|\d{3,}/g,'…');
const pnT=o=>STUDY&&!SHOWN.has(o.id)?hideNums(o.pn):o.pn;
function list(){
  const q=norm(Q.trim());
  return OFFERS.filter(o=>(CAT==='all'||o.cat===CAT)&&(!q||norm([o.ar,o.en,o.what,o.who,CATS[o.cat],o.pn].join(' ')).includes(q)));
}
function renderTabs(){
  $('tabs').innerHTML=`<button data-a="jump" data-v="offers">Offers</button><button data-a="jump" data-v="prices">Price table</button><span class="sep" aria-hidden="true"></span>`+
   [['all','All']].concat(Object.entries(CATS)).map(([k,t])=>`<button data-a="cat" data-v="${k}" class="${CAT===k?'on':''}">${t}</button>`).join('');
}
function render(){
  const ls=list();
  const groups=Object.keys(CATS).map(k=>[k,ls.filter(o=>o.cat===k)]).filter(g=>g[1].length);
  const hiddenCount=ls.filter(o=>o.price!=='—'&&!SHOWN.has(o.id)).length;
  $('studyBtn').classList.toggle('on',STUDY); $('studyBtn').setAttribute('aria-pressed',STUDY);
  $('main').innerHTML=`
   <div class="notes">
    <div class="note"><b>All prices are in UAE dirhams (AED)</b><span>Big Gift Week offers. Prices do not include VAT.</span></div>
    <div class="note"><b>Every offer comes with a gift the customer chooses</b><span>Sculptra comes with two gifts.</span></div>
    <div class="note"><b>The first consultation and the follow-up are free</b><span>Any service not in the offers is priced after the consultation.</span></div>
   </div>
   <div class="legend"><span class="chip c-ok">Confirmed</span> you can tell the customer · <span class="chip c-warn">Needs confirmation</span> say "I'll confirm the price before booking" · <span class="chip c-no">Price not available</span> don't say any number</div>
   ${STUDY?`<div class="studybar"><b>Study mode is on</b><span>Prices are hidden. Say the price in your head first, then tap to check if you were right.</span><span class="sp"></span><button class="btn" data-a="revealall">Show all</button><button class="btn" data-a="hideall">Hide again</button></div>`:''}

   <section id="offers"><div class="sh"><div class="eyebrow">${ls.length} offers${CAT!=='all'?' · '+CATS[CAT]:''}</div><h2>Offers</h2><p>Tap any offer to open it: what it is, how to say it, and what the customer may ask.</p></div>
    ${ls.length?`<div class="offers">${groups.map(([k,os])=>`${CAT==='all'?`<h3 class="cathead">${CATS[k]} <span class="n">${os.length}</span></h3>`:''}${os.map(o=>{const open=OPEN.has(o.id);return `<article class="offer" id="o-${o.id}">
      <div class="ohead"><button data-a="toggle" data-v="${o.id}" aria-expanded="${open}" style="background:none;border:0;padding:0;text-align:start;display:grid;gap:0"><h3>${esc(o.ar)}</h3><span class="en ltr">${esc(o.en)}</span><span class="chips">${stChip(o.st)}</span></button>
       <div class="price">${priceHtml(o)}<span class="n">${esc(pnT(o))}</span></div></div>
      ${open?`<div class="obody"><div class="two"><div><div class="lbl">What it is</div><div>${esc(o.what)}</div></div><div><div class="lbl">When to offer it</div><div>${esc(o.who)}</div></div></div>
       <div class="say"><span class="lbl">Say it like this</span><p>${esc(STUDY&&!SHOWN.has(o.id)?hideNums(o.say):o.say)}</p></div>
       ${o.qa.length?`<div><div class="lbl">Expected customer questions</div><div class="qa">${o.qa.map(([q,a])=>`<div><span class="q">${esc(q)}</span><span class="a">${esc(a)}</span></div>`).join('')}</div></div>`:''}
       ${o.caution?`<div class="caution ${o.st==='no'?'no':''}"><b>Be careful:</b> ${esc(o.caution)}</div>`:''}
       <div class="src">Source: slide ${o.slide}</div></div>`:''}</article>`}).join('')}`).join('')}</div>`:`<div class="empty">No offers with that name. Try another word.</div>`}</section>

   <section id="prices"><div class="sh"><div class="eyebrow">At a glance</div><h2>Price table</h2></div>
    ${ls.length?`<div class="tw"><table><thead><tr><th>Service</th><th>Price (AED)</th><th>Details</th><th>Status</th></tr></thead><tbody>
    ${groups.map(([k,os])=>`<tr class="grp"><td colspan="4">${CATS[k]}</td></tr>`+os.map(o=>`<tr><td>${esc(o.ar)}</td><td class="m">${o.price==='—'?'—':STUDY&&!SHOWN.has(o.id)?`<span class="hidep" data-a="reveal" data-v="${o.id}" role="button" tabindex="0">Tap</span>`:esc(o.price)}</td><td>${esc(pnT(o))}</td><td>${stChip(o.st)}</td></tr>`).join('')).join('')}
    </tbody></table></div>`:''}</section>

   <div class="foot">Last updated: ${UPDATED} · Source: ${esc(SRC)}. If a price is marked "Needs confirmation", check with your team leader before you say it.</div>`;
}
function setHH(){document.documentElement.style.setProperty('--hh',Math.round($('top').getBoundingClientRect().height)+'px')}
$('q').addEventListener('input',e=>{Q=e.target.value;render()});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t) return; const a=t.dataset.a, v=t.dataset.v;
  if(a==='toggle'){OPEN.has(v)?OPEN.delete(v):OPEN.add(v);render()}
  if(a==='cat'){CAT=v;renderTabs();render();window.scrollTo({top:0})}
  if(a==='jump'){const el=$(v); if(el) el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
  if(a==='study'){STUDY=!STUDY;SHOWN.clear();try{localStorage.setItem('hp-offers-study',STUDY?'1':'0')}catch(err){}render()}
  if(a==='reveal'){SHOWN.add(v);render()}
  if(a==='revealall'){OFFERS.forEach(o=>SHOWN.add(o.id));render()}
  if(a==='hideall'){SHOWN.clear();render()}
  if(a==='totop'){window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.a==='reveal'){e.preventDefault();e.target.click()} });
window.addEventListener('resize',setHH);
renderTabs(); render(); setHH();
document.getElementById('langbtn').addEventListener('click',e=>{e.preventDefault();location.href=e.currentTarget.getAttribute('href')+location.hash;});
</script>
